<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Puzzle Snake</title>
<meta name="theme-color" content="#0a1230">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout (phone, Telegram Mini App): one screen, no page scroll. Top bar with stats and buttons, perimeter meter, square field, solutions carried by the snake, arrow pad. Reference opens as a bottom sheet. */
:root{
  --bg:#0a1230;--surface:#101a40;--surface2:#16245a;--line:#22306a;--fg:#eef2ff;--muted:#93a0cf;
  --threat:#ff8f0c;--good:#affb33;--core:#2176ff;
  --font-display:"Unbounded","Arial Black",sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.k{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.v{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:100%;background:var(--good);transition:width .25s ease,background-color .25s ease}
.fill.low{background:var(--threat)}
.field{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);width:300px;height:300px}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.inv{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:26px}
.inv-e{font-size:12px;color:var(--muted)}
.ichip{font-weight:800;font-size:11px;padding:3px 7px;border-radius:5px;background:var(--pc);color:var(--bg);white-space:nowrap}
.ichip.enc{background:#5b6690;color:var(--fg)}
.ov{margin:auto;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.ov.mid{align-items:center;text-align:center}
.ov .logo{height:30px;align-self:center}
.ov h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.2;text-wrap:balance}
.ov p{margin:0;color:var(--muted);font-size:13px}
.ov p b{color:var(--fg)}
.ov .small{font-size:12px}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{appearance:none;border:0;cursor:pointer;background:var(--good);color:var(--bg);font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.01em;padding:13px 18px;border-radius:8px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible,.ib:focus-visible{outline:2px solid var(--good);outline-offset:2px}
.acts{display:flex;flex-direction:column;gap:8px;width:100%}
.acts .btn{width:100%}
.stars{font-size:28px;letter-spacing:5px;color:var(--good);line-height:1}
.stars i{font-style:normal;color:var(--line)}
.rep{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin:0;width:100%;font-size:13px;text-align:left}
.rep dt{color:var(--muted)}
.rep dd{margin:0;font-family:var(--font-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.recs{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.rec{border-left:3px solid var(--pc);background:var(--surface);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--muted);line-height:1.45}
.rec b{color:var(--fg)}
.rec .pz{display:block;margin-top:6px;color:var(--fg)}
.site{color:var(--good);font-weight:700}
.ib{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:800;font-size:15px}
.ib[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.ib[disabled]{opacity:.35;cursor:default}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:8px;padding:9px 11px}
.card.off{opacity:.45}
.card.focus{border-color:var(--good);border-left-color:var(--pc)}
.card .body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .nm{font-weight:800;font-size:13px;line-height:1.3}
.card .ds{font-size:12px;color:var(--muted);line-height:1.4}
.card .gm{font-size:12px;color:var(--good);line-height:1.4}
.card .vs{display:flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap}
.badge{font-family:var(--font-mono);font-size:10px;white-space:nowrap;color:var(--muted)}
.badge.new{color:var(--bg);background:var(--good);padding:1px 6px;border-radius:3px}
.sq{flex:none;width:40px;height:30px;border-radius:6px;background:var(--surface2);border:2px solid var(--pc);display:grid;place-items:center;font-weight:800;font-size:10px;white-space:nowrap;overflow:hidden}
.ico{flex:none;display:block}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

:root{--app-h:100vh;--pt:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));--pb:calc(env(safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px))}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{height:var(--app-h);display:flex;flex-direction:column;gap:8px;padding:calc(var(--pt) + 8px) max(10px,env(safe-area-inset-right,0px)) calc(var(--pb) + 8px) max(10px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:8px;flex:none}
.logo{height:22px;width:auto;display:block;flex:none}
.stats{display:flex;gap:12px;flex:1;min-width:0;justify-content:flex-end}
.st{display:flex;flex-direction:column;line-height:1.1}
.st .k{font-size:9px}
.st .v{font-size:15px}
.meter{display:flex;align-items:center;gap:8px;flex:none;font-size:11px;color:var(--muted)}
.meter .track{flex:1;height:6px}
.meter b{font-family:var(--font-mono);font-weight:500;color:var(--fg);min-width:36px;text-align:right}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.inv{flex:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.inv::-webkit-scrollbar{display:none}
.pad{flex:none;align-self:center;display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,52px);gap:6px}
.pad button{border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}
.pad [data-dir="u"]{grid-area:1/2}.pad [data-dir="l"]{grid-area:2/1}.pad [data-dir="r"]{grid-area:2/3}.pad [data-dir="d"]{grid-area:3/2}
@media (max-height:640px){.pad{grid-template-rows:repeat(3,44px);grid-template-columns:repeat(3,68px)}}
.pad button:active{background:var(--surface2);border-color:var(--good)}
.overlay{position:fixed;inset:0;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(10,18,48,.96);padding:calc(var(--pt) + 18px) 16px calc(var(--pb) + 18px);display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
.acts .btn{padding:14px 16px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:82%;display:flex;flex-direction:column;background:var(--bg);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:10px 12px calc(var(--pb) + 12px)}
.sh-top{display:flex;align-items:center;gap:6px;flex:none;margin-bottom:8px}
.tab{appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px}
.tab[aria-selected="true"]{border-color:var(--good);color:var(--good)}
.sh-x{margin-left:auto}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;-webkit-user-select:text;user-select:text}
</style>
</head>

  var SORD=['idm','pam','siem','edr','dlp','waf','ngfw','nad','cs','web'];

  // ---------- state ----------

  // ---------- cells ----------
  function threatAt(x,y){for(var i=0;i<threats.length;i++)if(threats[i].x===x&&threats[i].y===y)return threats[i];return null;}

  function headDist(x,y){var h=snake[0],dx=Math.abs(x-h.x),dy=Math.abs(y-h.y);return Math.min(dx,N-dx)+Math.min(dy,N-dy);}

      var x=rint(big?N-1:N),y=rint(big?N-1:N);

    return null;
  }

  // ---------- cargo ----------
  function carried(s){var n=0;for(var i=1;i<cargo.length;i++)if(cargo[i]===s)n++;return n;}

  function encrypt(n){var c=0;for(var i=1;i<cargo.length&&c<n;i++)if(cargo[i]&&cargo[i]!=='enc'){cargo[i]='enc';c++;}return c;}

  // ---------- spawning ----------
  function weighted(list){var s=0,i;for(i=0;i<list.length;i++)s+=list[i][1];var r=Math.random()*s;for(i=0;i<list.length;i++){r-=list[i][1];if(r<=0)return list[i][0];}return list[0][0];}

    return t;
  }
  function spawnThreat(){
    var types=unlockedT(),list=[];

    boss={x:c.x,y:c.y,need:need,phase:0,age:0,hopT:9};
    bossT=60;
    banner={title:'Целевая атака',text:'Финальный босс: коснитесь его 4 раза, каждый раз нужным решением. Нужное решение показано на нём.',col:C.boss,k:'boss',life:4.5};
    ensurePickup(need[0]);haptic('bad');
  }

  // ---------- flow ----------
  function setupWave(n){
    wave=n;toSpawn=n===WAVES?6:3+n;spawnT=1.2;gapT=0;
    var k=TORD[n-1];
    if(n===1)banner={title:'Волна 1',text:'Соберите решение того же цвета, что и угроза, и коснитесь угрозы головой змейки, пока не истёк её таймер.',col:C.lime,k:'cred',life:5};
    else if(n===WAVES)banner={title:'Финальная волна',text:'В конце волны придёт целевая атака.',col:C.boss,k:'boss',life:3.5};
    else if(k){var s=solFor(k);banner={title:'Новая угроза',text:short(TH[k].name)+'. '+TH[k].trait,hint:s?'Её закрывает '+SOL[s].abbr:'Закрывается любыми двумя решениями',col:TH[k].col,k:k,life:4.5};}
    while(pickups.length<3)spawnPickup();
    renderPanels();
  }
  function start(){
    snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];cargo=[null,null,null];dir={x:1,y:0};queue=[];acc=0;
    pickups=[];threats=[];boss=null;bossDone=false;integrity=100;score=0;combo=0;maxLen=3;
    floats=[];bursts=[];rings=[];banner=null;flash=0;shake=0;silentPause=false;
    stats={spawned:0,neutral:0,miss:{},bossLeak:false,bossWin:false};
    state='play';hideOverlay();
    var pb=$('pausebtn');if(pb){pb.disabled=false;pb.setAttribute('aria-pressed','false');}
    T(function(t){if(t.enableClosingConfirmation)t.enableClosingConfirmation();});
    setupWave(1);last=performance.now();syncBack();
  }
  function setDir(nx,ny){
    if(state!=='play')return;
    var ref=queue.length?queue[queue.length-1]:dir;
    if((nx===ref.x&&ny===ref.y)||(nx===-ref.x&&ny===-ref.y))return;
    if(queue.length<2)queue.push({x:nx,y:ny});
  }

  // ---------- effects ----------
  function burst(x,y,col,n){if(calm)n=Math.ceil(n/3);for(var i=0;i<n;i++){var a=Math.random()*6.2832,s=30+Math.random()*120;bursts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,col:col});}}
  function float(x,y,txt,col,big){floats.push({x:x,y:y,txt:txt,col:col,life:big?1.5:1,big:!!big});}
  function damage(n,x,y,col,label){
    integrity-=n;combo=0;flash=.4;shake=calm?0:7;haptic('hit');
    float(x,y,'−'+n+(label?' '+label:''),col||C.orange);
    if(integrity<=0){integrity=0;finish(false,'Периметр прорван');}
  }

  // ---------- step ----------
  function step(){
    if(queue.length)dir=queue.shift();
    var h=snake[0],nx=(h.x+dir.x+N)%N,ny=(h.y+dir.y+N)%N;
    var p=pickAt(nx,ny);
    var bodyEnd=p?snake.length:snake.length-1;
    for(var i=0;i<bodyEnd;i++)if(snake[i].x===nx&&snake[i].y===ny){finish(false,'Змейка врезалась в себя');return;}
    snake.unshift({x:nx,y:ny});
    if(p){
      pickups.splice(pickups.indexOf(p),1);
      cargo.splice(1,0,p.s);
      if(snake.length>MAXLEN){snake.pop();cargo.pop();}
      if(snake.length>maxLen)maxLen=snake.length;
      score+=5;haptic('tap');
      var px=(nx+.5)*CELL,py=(ny+.5)*CELL;
      burst(px,py,scol(p.s),10);float(px,py-10,SOL[p.s].abbr,scol(p.s));
      if(pickups.length<3+(wave>=6?1:0))spawnPickup();
    }else{snake.pop();}
    var t=threatAt(nx,ny);
    if(t)touchThreat(t);
    if(state!=='play')return;
    if(bossAt(nx,ny))touchBoss();
    renderInv();
  }
  function neutralize(t){
    threats.splice(threats.indexOf(t),1);
    combo++;stats.neutral++;
    var pts=TH[t.k].pts*mult();score+=pts;
    var x=(t.x+.5)*CELL,y=(t.y+.5)*CELL;
    burst(x,y,TH[t.k].col,16);rings.push({x:x,y:y,col:TH[t.k].col,life:.45,max:44});
    float(x,y-12,'+'+pts,C.lime);
  }
  function miss(t,how){
    threats.splice(threats.indexOf(t),1);
    stats.miss[t.k]=(stats.miss[t.k]||0)+1;
    var d=TH[t.k],x=(t.x+.5)*CELL,y=(t.y+.5)*CELL;
    burst(x,y,d.col,12);
    damage(d.dmg,x,y,d.col,how==='touch'?'нет решения':'прорыв');
    if(state!=='play')return;
    if(t.k==='ransom'){var n=encrypt(2);if(n)float(x,y+16,'Зашифровано решений: '+n,d.col);}
    if(t.k==='container'&&!t.copy){var c=freeCell(4);if(c){var nt=addThreat('container',c);nt.copy=true;stats.spawned--;}}
  }
  function touchThreat(t){
    if(t.k==='vuln'){
      if(usable()>=2){consumeAny(2);neutralize(t);haptic('ok');}
      else{miss(t,'touch');loseTail(2);}
      return;
    }
    var s=solFor(t.k);
    if(carried(s)>0){
      consume(s);neutralize(t);haptic('ok');
      if(t.k==='ddos'){
        for(var i=threats.length-1;i>=0;i--){var o=threats[i];if(o.k==='ddos'&&Math.abs(o.x-t.x)+Math.abs(o.y-t.y)<=4)neutralize(o);}
      }
    }else{
      miss(t,'touch');loseTail(2);
      if(state==='play')float((t.x+.5)*CELL,(t.y+.5)*CELL+18,'нужен '+SOL[s].abbr,TH[t.k].col);
    }
  }
  function touchBoss(){
    if(boss.cool>0)return;
    var need=boss.need[boss.phase],bx=(boss.x+1)*CELL,by=(boss.y+1)*CELL;
    if(carried(need)>0){
      consume(need);boss.phase++;combo++;haptic('ok');
      burst(bx,by,scol(need),24);rings.push({x:bx,y:by,col:scol(need),life:.5,max:70});
      score+=40*mult();
      if(boss.phase>=boss.need.length){
        boss=null;bossDone=true;stats.bossWin=true;score+=300;
        float(bx,by,'Целевая атака отражена +300',C.lime,true);burst(bx,by,C.boss,50);rings.push({x:bx,y:by,col:C.lime,life:.7,max:220});
        return;
      }
      float(bx,by-26,'Этап '+boss.phase+' из 4 пройден',C.lime);
      var c=freeCell(5,true);if(c){boss.x=c.x;boss.y=c.y;}
      ensurePickup(boss.need[boss.phase]);
    }else{
      boss.cool=1;loseTail(2);damage(8,bx,by,C.boss,'нужен '+SOL[need].abbr);
    }
  }

  function update(dt){
    clock+=dt;flash=Math.max(0,flash-dt);shake=Math.max(0,shake-24*dt);
    if(banner){banner.life-=dt;if(banner.life<=0)banner=null;}
    var i;
    for(i=floats.length-1;i>=0;i--){floats[i].life-=dt;floats[i].y-=24*dt;if(floats[i].life<=0)floats.splice(i,1);}
    for(i=bursts.length-1;i>=0;i--){var b=bursts[i];b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.93;b.vy*=.93;if(b.life<=0)bursts.splice(i,1);}
    for(i=rings.length-1;i>=0;i--){rings[i].life-=dt;if(rings[i].life<=0)rings.splice(i,1);}
    if(state!=='play')return;

    acc+=dt;var st=tick();
    while(acc>=st&&state==='play'){acc-=st;step();}
    if(state!=='play')return;

    for(i=pickups.length-1;i>=0;i--){pickups[i].age+=dt;if(pickups[i].age>28&&pickups.length>3)pickups.splice(i,1);}
    for(i=threats.length-1;i>=0;i--){
      var t=threats[i];t.age+=dt;t.t-=dt;
      if(t.k==='scan'||t.k==='lateral'){
        t.hopT-=dt;
        if(t.hopT<=0){
          if(t.k==='scan'){t.hopT=.75;var dirs=[[1,0],[-1,0],[0,1],[0,-1]],d=dirs[rint(4)],nx=(t.x+d[0]+N)%N,ny=(t.y+d[1]+N)%N;if(!occupied(nx,ny)&&headDist(nx,ny)>1){t.x=nx;t.y=ny;}}
          else{t.hopT=3;var c=freeCell(4);if(c){burst((t.x+.5)*CELL,(t.y+.5)*CELL,TH.lateral.col,6);t.x=c.x;t.y=c.y;rings.push({x:(c.x+.5)*CELL,y:(c.y+.5)*CELL,col:TH.lateral.col,life:.4,max:28});}}
        }
      }
      if(t.t<=0){miss(t,'timer');if(state!=='play')return;}
    }
    if(boss){
      boss.age+=dt;bossT-=dt;if(boss.cool>0)boss.cool-=dt;
      boss.hopT-=dt;
      if(boss.hopT<=0){boss.hopT=9;var bc=freeCell(5,true);if(bc){boss.x=bc.x;boss.y=bc.y;}}
      if(bossT<=0){
        var bx=(boss.x+1)*CELL,by=(boss.y+1)*CELL;boss=null;bossDone=true;stats.bossLeak=true;
        damage(35,bx,by,C.boss,'целевая атака');
        if(state!=='play')return;
      }
    }
    if(toSpawn>0){
      spawnT-=dt;
      if(spawnT<=0&&threats.length<maxActive()){spawnThreat();toSpawn--;spawnT=spawnEvery()*rand(.8,1.2);}
    }else if(wave===WAVES&&!boss&&!bossDone){
      gapT+=dt;if(gapT>1.5){gapT=0;spawnBoss();}
    }else if(!threats.length&&!boss){
      gapT+=dt;
      if(gapT>1.2){
        if(wave>=WAVES){finish(true);return;}
        integrity=Math.min(100,integrity+5);
        float(W/2,W*.42,'Волна '+wave+' отражена · +5% периметра',C.lime,true);
        setupWave(wave+1);
      }
    }
  }

  // ---------- drawing ----------
  function drawIcon(k,x,y,size,col){
    if(!paths[k])return;
    ctx.save();ctx.translate(x,y);var s=size/24;ctx.scale(s,s);ctx.translate(-12,-12);
    ctx.strokeStyle=col;ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(paths[k]);ctx.restore();
  }
  function glow(col,b){if(!calm){ctx.shadowColor=col;ctx.shadowBlur=b;}}
  function noGlow(){ctx.shadowBlur=0;}
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=C.navy;ctx.fillRect(0,0,W,W);
    ctx.save();
    if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    var x,y,i;
    for(x=0;x<N;x++)for(y=0;y<N;y++){
      if((x+y)%2===0){ctx.fillStyle='rgba(22,36,90,.35)';ctx.fillRect(x*CELL,y*CELL,CELL,CELL);}
    }
    ctx.fillStyle='rgba(147,160,207,.14)';
    for(x=0;x<N;x++)for(y=0;y<N;y++)ctx.fillRect(x*CELL+CELL/2-1,y*CELL+CELL/2-1,2,2);

    // pickups
    for(i=0;i<pickups.length;i++){
      var p=pickups[i],px=p.x*CELL,py=p.y*CELL,col=scol(p.s),pulse=calm?0:Math.sin(clock*5+i)*1.5;
      ctx.strokeStyle=col;ctx.globalAlpha=.35;ctx.lineWidth=1.5;rr(px+1-pulse/2,py+1-pulse/2,CELL-2+pulse,CELL-2+pulse,6);ctx.stroke();ctx.globalAlpha=1;
      glow(col,10);ctx.fillStyle=col;rr(px+3,py+3,CELL-6,CELL-6,5);ctx.fill();noGlow();
      ctx.fillStyle=C.navy;ctx.font='800 8px Manrope,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(SOL[p.s].abbr,px+CELL/2,py+CELL/2+.5,CELL-6);
    }
    // threats
    for(i=0;i<threats.length;i++){
      var t=threats[i],d=TH[t.k],tx=(t.x+.5)*CELL,ty=(t.y+.5)*CELL,frac=Math.max(0,t.t/t.life);
      var vis=t.k!=='priv'||Math.sin(t.age*2.4+t.ph)>-.2;
      ctx.save();
      if(!vis)ctx.globalAlpha=.18;
      glow(d.col,12);ctx.fillStyle=d.col;ctx.beginPath();ctx.arc(tx,ty,9,0,6.2832);ctx.fill();noGlow();
      drawIcon(t.k,tx,ty,12,C.navy);
      ctx.strokeStyle=frac<.3?C.orange:d.col;ctx.lineWidth=2.2;
      ctx.beginPath();ctx.arc(tx,ty,11.5,-Math.PI/2,-Math.PI/2+6.2832*frac);ctx.stroke();
      if(frac<.3&&!calm){ctx.globalAlpha=(vis?1:.18)*(.5+.5*Math.sin(clock*14));ctx.strokeStyle=C.orange;ctx.lineWidth=1;ctx.beginPath();ctx.arc(tx,ty,14,0,6.2832);ctx.stroke();}
      ctx.restore();
    }
    // boss
    if(boss){
      var bx=(boss.x+1)*CELL,by=(boss.y+1)*CELL,need=boss.need[boss.phase],nc=scol(need);
      ctx.save();glow(C.boss,24);ctx.fillStyle=C.boss;ctx.beginPath();ctx.arc(bx,by,20,0,6.2832);ctx.fill();noGlow();
      ctx.strokeStyle=C.lime;ctx.lineWidth=2.5;var rot=calm?0:boss.age*.8;
      for(var s=0;s<4;s++){var a0=rot+s*Math.PI/2;ctx.beginPath();ctx.arc(bx,by,24,a0,a0+Math.PI/3);ctx.stroke();}
      ctx.fillStyle=nc;rr(bx-14,by-8,28,16,4);ctx.fill();
      ctx.fillStyle=C.navy;ctx.font='800 9px Manrope,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(SOL[need].abbr,bx,by+.5,26);
      for(var ph=0;ph<boss.need.length;ph++){ctx.fillStyle=ph<boss.phase?C.lime:'rgba(10,18,48,.85)';ctx.beginPath();ctx.arc(bx-12+ph*8,by+14,2.6,0,6.2832);ctx.fill();}
      ctx.restore();
    }
    // snake
    for(i=snake.length-1;i>=0;i--){
      var sg=snake[i],sx=sg.x*CELL,sy=sg.y*CELL,cg=cargo[i];
      var fill=i===0?C.lime:(cg==='enc'?C.enc:(cg?scol(cg):(i%2?C.blue:C.blue2)));
      ctx.fillStyle=fill;rr(sx+2,sy+2,CELL-4,CELL-4,6);ctx.fill();
      if(cg==='enc'){ctx.strokeStyle=C.navy;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(sx+7,sy+7);ctx.lineTo(sx+CELL-7,sy+CELL-7);ctx.moveTo(sx+CELL-7,sy+7);ctx.lineTo(sx+7,sy+CELL-7);ctx.stroke();}
      else if(cg){ctx.fillStyle=C.navy;ctx.font='800 7px Manrope,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(SOL[cg].abbr,sx+CELL/2,sy+CELL/2+.5,CELL-6);}
    }
    if(snake.length){
      var h=snake[0],hx=h.x*CELL+CELL/2,hy=h.y*CELL+CELL/2,pxn=-dir.y,pyn=dir.x;
      ctx.fillStyle=C.navy;
      for(var e=-1;e<=1;e+=2){ctx.beginPath();ctx.arc(hx+dir.x*4+pxn*5*e,hy+dir.y*4+pyn*5*e,2.2,0,6.2832);ctx.fill();}
    }
    for(i=0;i<rings.length;i++){var r=rings[i],k=1-r.life/.45;ctx.globalAlpha=Math.max(0,1-k);ctx.strokeStyle=r.col;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(r.x,r.y,Math.max(1,r.max*k),0,6.2832);ctx.stroke();}
    ctx.globalAlpha=1;
    for(i=0;i<bursts.length;i++){var q=bursts[i];ctx.globalAlpha=Math.max(0,q.life/.5);ctx.fillStyle=q.col;ctx.fillRect(q.x-2,q.y-2,4,4);}
    ctx.globalAlpha=1;ctx.textBaseline='alphabetic';ctx.textAlign='center';
    for(i=0;i<floats.length;i++){
      var f=floats[i];ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.col;
      ctx.font=f.big?'700 16px Unbounded,Manrope,sans-serif':'700 13px Manrope,sans-serif';
      ctx.fillText(f.txt,Math.min(W-90,Math.max(90,f.x)),f.y);
    }
    ctx.globalAlpha=1;
    ctx.restore();
    if(flash>0){ctx.strokeStyle='rgba(255,143,12,'+flash+')';ctx.lineWidth=8;ctx.strokeRect(0,0,W,W);}
    if(boss&&state!=='menu'){
      var bw=W-80,pct=Math.max(0,bossT/60);
      ctx.fillStyle='rgba(10,18,48,.85)';rr(40,8,bw,8,4);ctx.fill();ctx.fillStyle=C.boss;rr(40,8,Math.max(8,bw*pct),8,4);ctx.fill();
      ctx.font='700 11px "JetBrains Mono",monospace';ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.fillText('ЦЕЛЕВАЯ АТАКА · этап '+(boss.phase+1)+' из 4 · '+Math.ceil(bossT)+' с',W/2,32);
    }
    if(banner){
      var bx2=20,by2=W*.3,bw2=W-40,bc=banner.col||C.lime;
      ctx.font='600 14px Manrope,sans-serif';
      var lines=wrap(banner.text,bw2-80),bh=64+lines.length*19+(banner.hint?18:0);
      ctx.globalAlpha=Math.min(1,banner.life*1.5);
      ctx.fillStyle='rgba(10,18,48,.95)';rr(bx2,by2,bw2,bh,10);ctx.fill();
      ctx.strokeStyle=bc;ctx.lineWidth=2;rr(bx2,by2,bw2,bh,10);ctx.stroke();
      ctx.fillStyle=bc;ctx.beginPath();ctx.arc(bx2+34,by2+36,19,0,6.2832);ctx.fill();
      if(banner.k)drawIcon(banner.k,bx2+34,by2+36,22,C.navy);
      ctx.textAlign='left';ctx.fillStyle=bc;ctx.font='700 15px Unbounded,Manrope,sans-serif';
      ctx.fillText(banner.title,bx2+64,by2+30,bw2-76);
      ctx.fillStyle=C.ink;ctx.font='600 14px Manrope,sans-serif';
      for(i=0;i<lines.length;i++)ctx.fillText(lines[i],bx2+64,by2+53+i*19);
      if(banner.hint){ctx.fillStyle=C.lime;ctx.font='700 14px Manrope,sans-serif';ctx.fillText(banner.hint,bx2+64,by2+56+lines.length*19,bw2-76);}
      ctx.globalAlpha=1;
    }
  }
  function wrap(text,maxW){var w=text.split(' '),out=[],line='';for(var i=0;i<w.length;i++){var t=line?line+' '+w[i]:w[i];if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w[i];}else line=t;}if(line)out.push(line);return out;}

  // ---------- panels ----------
  function renderInv(){
    var el=$('inv');if(!el)return;
    var counts={},enc=0,h='';
    for(var i=1;i<cargo.length;i++){var c=cargo[i];if(c==='enc')enc++;else if(c)counts[c]=(counts[c]||0)+1;}
    var keys=SORD.filter(function(s){return counts[s];});
    if(!keys.length&&!enc)h='<span class="inv-e">В змейке нет решений. Соберите квадратики нужного цвета.</span>';
    keys.forEach(function(s){h+='<span class="ichip" style="--pc:'+scol(s)+'">'+SOL[s].abbr+(counts[s]>1?' ×'+counts[s]:'')+'</span>';});
    if(enc)h+='<span class="ichip enc">зашифровано ×'+enc+'</span>';
    if(el._h!==h){el.innerHTML=h;el._h=h;}
  }
  function solCard(s,focus){
    var d=SOL[s],t=TH[d.counter],locked=state!=='menu'&&fromWave(d.counter)>wave,n=state==='play'||state==='pause'?carried(s):0;
    return '<div class="card'+(locked?' off':'')+(focus===s?' focus':'')+'" id="sc-'+s+'" style="--pc:'+t.col+'"><span class="sq">'+d.abbr+'</span><span class="body">'+
      '<span class="hd"><span class="nm">'+esc(d.name)+'</span>'+(locked?'<span class="badge">с '+fromWave(d.counter)+'-й волны</span>':(n?'<span class="badge new">в змейке ×'+n+'</span>':''))+'</span>'+
      '<span class="ds">'+esc(d.desc)+'</span>'+
      '<span class="vs">В игре нейтрализует: '+iconSVG(d.counter,16)+'<b>'+esc(short(t.name))+'</b></span></span></div>';
  }
  function thrCard(k){
    var t=TH[k],s=solFor(k),locked=state!=='menu'&&fromWave(k)>wave,isNew=state!=='menu'&&fromWave(k)===wave;
    var active=threats.filter(function(x){return x.k===k;}).length;
    return '<div class="card'+(locked?' off':'')+'" style="--pc:'+t.col+'">'+iconSVG(k,26)+'<span class="body">'+
      '<span class="hd"><span class="nm">'+esc(t.name)+'</span>'+(locked?'<span class="badge">с '+fromWave(k)+'-й волны</span>':(isNew?'<span class="badge new">новая</span>':(active?'<span class="badge">на поле ×'+active+'</span>':'')))+'</span>'+
      '<span class="ds">'+esc(t.desc)+'</span><span class="gm">В игре: '+esc(t.trait)+'</span>'+
      '<span class="vs">Закрывает: <b style="color:'+t.col+'">'+(s?SOL[s].abbr:'любые два решения · аудит ИБ')+'</b></span></span></div>';
  }
  function bossCard(){
    return '<div class="card'+(state!=='menu'&&wave<WAVES?' off':'')+'" style="--pc:'+C.boss+'">'+iconSVG('boss',26)+'<span class="body"><span class="hd"><span class="nm">Целевая атака</span><span class="badge">финал, '+WAVES+'-я волна</span></span>'+
      '<span class="gm">В игре: финальный босс. Нужно коснуться его 4 раза, каждый раз решением, которое на нём написано. На всё 60 секунд.</span></span></div>';
  }
  var lastPanels='';
  function renderPanels(){
    var sl=$('sollist'),tl=$('thrlist');
    if(sl){var h=SORD.map(function(s){return solCard(s);}).join('');if(sl._h!==h){sl.innerHTML=h;sl._h=h;}}
    if(tl){var h2=TORD.map(thrCard).join('')+bossCard();if(tl._h!==h2){tl.innerHTML=h2;tl._h=h2;}}
  }

  // ---------- sheet (mobile) ----------
  var sheetTab='sol',sheetOpen=false;
  function openSheet(tab,focus){
    if(!$('sheet'))return;
    sheetTab=tab||'sol';sheetOpen=true;
    if(state==='play')pauseGame(true);
    renderSheet(focus);$('sheet').hidden=false;$('sheetbg').hidden=false;syncBack();
  }
  function closeSheet(){
    sheetOpen=false;$('sheet').hidden=true;$('sheetbg').hidden=true;
    if(state==='pause'&&silentPause)resumeGame();
    syncBack();
  }
  function renderSheet(focus){
    $('tab-sol').setAttribute('aria-selected',sheetTab==='sol'?'true':'false');
    $('tab-thr').setAttribute('aria-selected',sheetTab==='thr'?'true':'false');
    var b=$('sheetbody');
    b.innerHTML=sheetTab==='sol'?SORD.map(function(s){return solCard(s,focus);}).join(''):TORD.map(thrCard).join('')+bossCard();
    b.scrollTop=0;
  }
  if($('sheet')){
    $('helpbtn').addEventListener('click',function(){openSheet('sol');});
    $('tab-sol').addEventListener('click',function(){sheetTab='sol';renderSheet();});
    $('tab-thr').addEventListener('click',function(){sheetTab='thr';renderSheet();});
    $('sheetx').addEventListener('click',closeSheet);
    $('sheetbg').addEventListener('click',closeSheet);
  }

  // ---------- overlays ----------
  function showOverlay(html,mid){var ov=$('ov');ov.className='ov'+(mid?' mid':'');ov.innerHTML=html;$('overlay').hidden=false;$('overlay').scrollTop=0;}
  function hideOverlay(){$('overlay').hidden=true;}
  function showMenu(){
    state='menu';silentPause=false;snake=[];cargo=[];pickups=[];threats=[];boss=null;
    var pb=$('pausebtn');if(pb){pb.disabled=true;pb.setAttribute('aria-pressed','false');}
    T(function(t){if(t.disableClosingConfirmation)t.disableClosingConfirmation();});
    var lg=MOBILE?document.querySelector('.top .logo'):null;
    var h=(lg?lg.outerHTML:'')+'<h2>Puzzle Snake</h2>'+
      '<p>Защитите периметр за <b>12 волн</b>. Собирайте решения — квадратики с названиями — и касайтесь головой угрозы <b>того же цвета</b>, пока не истёк её таймер.</p>'+
      '<p>В змейке помещается до 8 решений. Использованное решение уходит из змейки, и она становится короче. Угроза без нужного решения бьёт по периметру и отрезает хвост. Стены проходимы, но в себя врезаться нельзя.</p>'+
      (best?'<p>Рекорд: <b>'+best+'</b></p>':'')+
      '<div class="acts"><button class="btn" id="go" type="button">Начать игру</button>'+(MOBILE?'<button class="btn ghost" id="menuhelp" type="button">Справочник решений и угроз</button>':'')+'<button class="btn ghost" id="allgames" type="button">← Все игры</button></div>'+
      (MOBILE?'<p class="small">Управление: свайп по полю или кнопки со стрелками.</p>':'<p class="small">Управление: стрелки или W, A, S, D. Пауза: P или Esc.</p>');
    showOverlay(h,true);
    $('go').addEventListener('click',start);
    $('allgames').addEventListener('click',goHome);
    if($('menuhelp'))$('menuhelp').addEventListener('click',function(){openSheet('sol');});
    renderPanels();renderInv();syncBack();
  }
  function pauseGame(silent){
    if(state!=='play')return;
    state='pause';silentPause=!!silent;
    var pb=$('pausebtn');if(pb)pb.setAttribute('aria-pressed','true');
    if(!silent){
      showOverlay('<span class="lbl">Пауза</span><h2>Игра на паузе</h2><p>Волна '+wave+' из '+WAVES+'. Периметр '+Math.round(integrity)+'%, счёт '+score+'.</p>'+
        '<div class="acts"><button class="btn" type="button" id="resume">Продолжить</button><button class="btn ghost" type="button" id="restart">Начать заново</button><button class="btn ghost" type="button" id="tomenu">Главное меню</button></div>'+
        (MOBILE?'':'<p class="small">P или Esc — продолжить.</p>'),true);
      $('resume').addEventListener('click',resumeGame);
      $('restart').addEventListener('click',start);
      $('tomenu').addEventListener('click',showMenu);
    }
    syncBack();
  }
  function resumeGame(){
    if(state!=='pause')return;
    state='play';silentPause=false;hideOverlay();
    var pb=$('pausebtn');if(pb)pb.setAttribute('aria-pressed','false');
    last=performance.now();syncBack();
  }
  function plural(n,f1,f2,f5){var m=n%100,d=n%10;if(m>10&&m<20)return f5;if(d===1)return f1;if(d>=2&&d<=4)return f2;return f5;}
  function recsHTML(){
    var tail='<span class="pz">Компания Puzzle Systems подберёт нужный Вам продукт в соответствии с рекомендацией. Напишите нам: <a class="site" href="'+SITE+'" target="_blank" rel="noopener">puzzle.systems</a></span>';
    var ks=Object.keys(stats.miss).sort(function(a,b){return stats.miss[b]-stats.miss[a];});
    var h='<span class="lbl">'+(ks.length||stats.bossLeak?'Рекомендации по пропущенным атакам':'Рекомендации')+'</span><div class="recs">';
    ks.forEach(function(k){
      var t=TH[k],n=stats.miss[k],many=n>=(t.pack?6:3),txt;
      if(t.incident)txt=many?'Вы допустили большое количество инцидентов «'+t.name+'»':'Вы допустили '+n+' '+plural(n,'инцидент','инцидента','инцидентов')+' «'+t.name+'»';
      else txt=many?'Вы пропустили большое количество атак «'+t.name+'»':'Вы пропустили '+n+' '+plural(n,'атаку','атаки','атак')+' «'+t.name+'»';
      h+='<div class="rec" style="--pc:'+t.col+'"><b>'+esc(txt)+'</b>, вам необходимо '+esc(t.need)+', '+esc(t.help)+'.'+tail+'</div>';
    });
    if(stats.bossLeak)h+='<div class="rec" style="--pc:'+C.boss+'"><b>Целевая атака прорвалась к периметру.</b> Против целевых атак нужна комплексная защита: обратитесь в Puzzle Systems, специалисты оценят вашу инфраструктуру и подберут решения.'+tail+'</div>';
    if(!ks.length&&!stats.bossLeak)h+='<div class="rec" style="--pc:'+C.lime+'"><b>Ни одна атака не прорвалась.</b> Чтобы так же надёжно была защищена реальная инфраструктура, нужен комплекс решений.'+tail+'</div>';
    return h+'</div>';
  }
  var result='';
  function finish(win,reason){
    state='over';result=win?'win':(reason||'Периметр прорван');silentPause=false;
    var pb=$('pausebtn');if(pb){pb.disabled=true;pb.setAttribute('aria-pressed','false');}
    T(function(t){if(t.disableClosingConfirmation)t.disableClosingConfirmation();});
    haptic(win?'ok':'bad');
    var fresh=score>best;if(fresh){best=score;try{localStorage.setItem('psnake2-best',String(best));}catch(e){}}
    var total=stats.spawned,accN=total?stats.neutral/total:1;
    var stars=0;if(win){stars=1;if(integrity>=60)stars++;if(accN>=.75)stars++;}
    var leaked=0;for(var k in stats.miss)leaked+=stats.miss[k];
    var h='<span class="lbl">Отчёт смены</span><h2>'+(win?'Периметр защищён':esc(reason||'Периметр прорван'))+'</h2>';
    if(win){h+='<div class="stars" aria-label="'+stars+' из 3 звёзд">';for(var i=0;i<3;i++)h+=i<stars?'★':'<i>★</i>';h+='</div>';}
    h+='<dl class="rep"><dt>Счёт</dt><dd>'+score+(fresh?' · рекорд!':'')+'</dd>'+
      '<dt>Волна</dt><dd>'+wave+' из '+WAVES+'</dd>'+
      '<dt>Целостность периметра</dt><dd>'+Math.max(0,Math.round(integrity))+'%</dd>'+
      '<dt>Нейтрализовано угроз</dt><dd>'+stats.neutral+' из '+total+'</dd>'+
      '<dt>Пропущено атак</dt><dd>'+(leaked+(stats.bossLeak?1:0))+'</dd>'+
      '<dt>Максимальная длина змейки</dt><dd>'+maxLen+'</dd></dl>';
    if(win)h+='<p class="small">Звёзды: победа, периметр от 60%, нейтрализовано от 75% угроз.</p>';
    h+=recsHTML();
    h+='<div class="acts"><button class="btn" type="button" id="again">Сыграть ещё раз</button><button class="btn ghost" type="button" id="tomenu">Главное меню</button></div>';
    showOverlay(h,false);
    $('again').addEventListener('click',start);$('tomenu').addEventListener('click',showMenu);
    syncBack();
  }
  function syncBack(){
    if(!MOBILE)return;
    T(function(t){if(!t.BackButton)return;var show=true;if(show)t.BackButton.show();else t.BackButton.hide();});
  }
  if(MOBILE)T(function(t){if(t.BackButton)t.BackButton.onClick(function(){if(sheetOpen)closeSheet();else if(state==='play')pauseGame();else if(state==='pause')resumeGame();else goHome();});});

  // ---------- input ----------
  document.addEventListener('keydown',function(e){
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    var k=e.key,isP=k==='p'||k==='P'||k==='з'||k==='З';
    if(state==='pause'&&!silentPause&&(isP||k==='Escape')){resumeGame();e.preventDefault();return;}
    if(state!=='play')return;
    if(isP||k==='Escape'){pauseGame();e.preventDefault();return;}
    var h=true;
    if(k==='ArrowUp'||k==='w'||k==='W'||k==='ц'||k==='Ц')setDir(0,-1);
    else if(k==='ArrowDown'||k==='s'||k==='S'||k==='ы'||k==='Ы')setDir(0,1);
    else if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ф'||k==='Ф')setDir(-1,0);
    else if(k==='ArrowRight'||k==='d'||k==='D'||k==='в'||k==='В')setDir(1,0);
    else h=false;
    if(h)e.preventDefault();
  });
  var sx=0,sy=0,sw=false;
  cv.addEventListener('pointerdown',function(e){e.preventDefault();sw=true;sx=e.clientX;sy=e.clientY;});
  cv.addEventListener('pointermove',function(e){
    if(!sw)return;var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
    if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
    sx=e.clientX;sy=e.clientY;
  });
  function endSw(){sw=false;}
  cv.addEventListener('pointerup',endSw);cv.addEventListener('pointercancel',endSw);cv.addEventListener('pointerleave',endSw);
  cv.addEventListener('contextmenu',function(e){e.preventDefault();});
  Array.prototype.forEach.call(document.querySelectorAll('[data-dir]'),function(b){
    b.addEventListener('pointerdown',function(e){e.preventDefault();var d=b.getAttribute('data-dir');haptic('tap');
      if(d==='u')setDir(0,-1);else if(d==='d')setDir(0,1);else if(d==='l')setDir(-1,0);else setDir(1,0);});
  });
  var pb0=$('pausebtn');
  if(pb0)pb0.addEventListener('click',function(){if(state==='play')pauseGame();else if(state==='pause'&&!silentPause)resumeGame();});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play')pauseGame();});

  // ---------- layout ----------
  function fit(){
    var st=$('stage'),box=$('fieldbox');if(!st||!box)return;
    if(MOBILE){
      var h=window.innerHeight;if(tg&&tg.viewportStableHeight)h=Math.max(300,tg.viewportStableHeight);
      document.documentElement.style.setProperty('--app-h',h+'px');
    }
    var s=Math.floor(Math.max(200,Math.min(st.clientWidth,st.clientHeight)));
    box.style.width=s+'px';box.style.height=s+'px';
  }
  window.addEventListener('resize',fit);
  if(MOBILE)T(function(t){if(t.onEvent)t.onEvent('viewportChanged',fit);});

  // ---------- HUD ----------
  var L={};
  function setTxt(id,v){var el=$(id);if(el&&L[id]!==v){el.textContent=v;L[id]=v;}}
  var panelT=0;
  function hud(dt){
    var playing=state!=='menu';
    setTxt('score',String(score));
    setTxt('wave',playing?wave+'/'+WAVES:'—');
    setTxt('best',String(best));
    setTxt('combo','×'+mult());
    var iv=Math.round(integrity);
    if(L.int!==iv){L.int=iv;var it=$('intText');if(it)it.textContent=iv+'%';var f=$('intFill');if(f){f.style.width=iv+'%';f.classList.toggle('low',iv<35);}}
    panelT-=dt;if(panelT<=0){panelT=.5;renderPanels();renderInv();}
  }

  showMenu();fit();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  setTimeout(fit,300);
  last=performance.now();
  function frame(now){
    var dt=Math.min(.1,(now-last)/1000);last=now;
    update(dt);draw();hud(dt);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__sn={get:function(){return{result:result,state:state,wave:wave,score:score,integrity:integrity,len:snake.length,threats:threats.length,boss:!!boss,miss:stats?stats.miss:{},neutral:stats?stats.neutral:0,spawned:stats?stats.spawned:0};},
    world:function(){return{snake:snake.map(function(s){return{x:s.x,y:s.y};}),cargo:cargo.slice(),dir:dir,pickups:pickups.map(function(p){return{x:p.x,y:p.y,s:p.s};}),threats:threats.map(function(t){return{x:t.x,y:t.y,k:t.k,t:t.t};}),boss:boss?{x:boss.x,y:boss.y,need:boss.need[boss.phase]}:null};},
    setDir:setDir,start:start,solFor:solFor,hurt:function(v){integrity=v;}};
})();
</script>

</body>
</html>
