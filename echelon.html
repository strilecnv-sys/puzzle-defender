<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Эшелон</title>
<meta name="theme-color" content="#0a1230">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-only, one screen, no page scroll (Telegram Mini App). Top bar with stats and pause, thin core meter, the map fills the free height, then the next-wave strip with the start button, the solutions dock and a one-line hint. Reference (solutions/threats) opens as a bottom sheet. Every threat shares its colour with the solution that stops it. Single dark look: the logo wordmark is white. */
:root{
  --bg:#0a1230;--surface:#101a40;--surface2:#16245a;--line:#22306a;--fg:#eef2ff;--muted:#93a0cf;
  --threat:#ff8f0c;--good:#affb33;--core:#2176ff;
  --font-display:"Unbounded","Arial Black",sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --app-h:100vh;
  --pt:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --pb:calc(env(safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{height:var(--app-h);display:flex;flex-direction:column;gap:6px;padding:calc(var(--pt) + 8px) max(10px,env(safe-area-inset-right,0px)) calc(var(--pb) + 8px) max(10px,env(safe-area-inset-left,0px))}

.top{display:flex;align-items:center;gap:8px;flex:none}
.logo{height:22px;width:auto;display:block;flex:none}
.stats{display:flex;gap:12px;flex:1;min-width:0;justify-content:flex-end}
.st{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.st .k{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.st .v{font-family:var(--font-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ib{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:800;font-size:15px}
.ib[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.ib[disabled]{opacity:.35}

.meter{display:flex;align-items:center;gap:8px;flex:none;font-size:11px;color:var(--muted)}
.meter b{font-family:var(--font-mono);font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.track{flex:1;height:6px;background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;width:100%;background:var(--good);transition:width .25s ease,background-color .25s ease}
.fill.low{background:var(--threat)}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.field{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);width:300px;height:400px}
canvas{display:block;width:100%;height:100%;touch-action:none}

.wavebar{display:flex;gap:6px;flex:none;height:46px}
.next{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 8px;scrollbar-width:none;cursor:pointer}
.next::-webkit-scrollbar{display:none}
.next .nl{font-family:var(--font-mono);font-size:10px;color:var(--muted);white-space:nowrap}
.nchip{display:flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:11px;white-space:nowrap}
.nchip.new{color:var(--good)}
.btn{appearance:none;border:0;cursor:pointer;background:var(--good);color:var(--bg);font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.01em;padding:12px 18px;border-radius:8px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
#wavebtn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;font-size:12px;line-height:1.15;min-width:104px}
#wavebtn .sb{font-family:var(--font-mono);font-weight:500;font-size:10px;opacity:.85}
#speed{flex:none;width:46px;padding:0;font-size:12px}
#speed[aria-pressed="true"]{border-color:var(--good);color:var(--good)}

.dock{display:flex;gap:6px;overflow-x:auto;flex:none;scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:1px}
.dock::-webkit-scrollbar{display:none}
.tw{flex:0 0 58px;height:54px;scroll-snap-align:start;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-bottom:3px solid var(--pc);border-radius:8px;padding:0 2px}
.tw .a{font-weight:800;font-size:12px;line-height:1}
.tw .c{font-family:var(--font-mono);font-size:10px;color:var(--good);line-height:1}
.tw.poor .c{color:var(--threat)}
.tw .d{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.tw[aria-pressed="true"]{background:var(--pc);color:var(--bg);border-color:var(--pc)}
.tw[aria-pressed="true"] .c{color:var(--bg)}
.tw[aria-pressed="true"] .d{background:var(--bg)}

.hint{flex:none;min-height:34px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);line-height:1.3}
.hint b{color:var(--fg)}
.hint .dot{flex:none;width:10px;height:10px;border-radius:50%}
.hint .tx{flex:1;min-width:0}
.hint .more{flex:none;appearance:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}

.pop{position:absolute;z-index:3;width:max-content;max-width:calc(100% - 8px);background:rgba(10,18,48,.97);border:1px solid var(--good);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.pop-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.pop-h b{font-weight:800;font-size:13px}
.pop-x{margin-left:auto;appearance:none;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.pop-s{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.pop-b{display:flex;gap:6px;flex-wrap:wrap}
.mini{appearance:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);font-weight:700;font-size:12px;padding:9px 11px;border-radius:6px}
.mini.up{background:var(--good);color:var(--bg);border-color:var(--good)}
.mini[disabled]{opacity:.4}

.overlay{position:fixed;inset:0;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(10,18,48,.96);padding:calc(var(--pt) + 18px) 16px calc(var(--pb) + 18px);display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
.ov{margin:auto;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.ov.mid{align-items:center;text-align:center}
.ov .logo{height:30px;align-self:center}
.ov h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.2;text-wrap:balance}
.ov p{margin:0;color:var(--muted);font-size:13px}
.ov p b{color:var(--fg)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px;width:100%}
.opt{appearance:none;cursor:pointer;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0;width:100%}
.opt b{font-size:13px}
.opt span{font-size:11px;color:var(--muted);line-height:1.35}
.opt .st2{font-family:var(--font-mono);font-size:11px;color:var(--good)}
.opt[aria-pressed="true"]{border-color:var(--good);background:var(--surface2)}
.diff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.diff .opt{align-items:center;text-align:center;padding:8px 4px}
.acts{display:flex;flex-direction:column;gap:8px;width:100%}
.acts .btn{width:100%;padding:14px 16px}
.stars{font-size:28px;letter-spacing:5px;color:var(--good);line-height:1}
.stars i{font-style:normal;color:var(--line)}
.rep{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin:0;width:100%;font-size:13px;text-align:left}
.rep dt{color:var(--muted)}
.rep dd{margin:0;font-family:var(--font-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.recs{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.rec{border-left:3px solid var(--pc);background:var(--surface);padding:10px 12px;border-radius:6px;font-size:13px;color:var(--muted);line-height:1.45}
.rec b{color:var(--fg)}
.rec .pz{display:block;margin-top:6px;color:var(--fg)}
.site{color:var(--good);font-weight:700}

.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:82%;display:flex;flex-direction:column;background:var(--bg);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:10px 12px calc(var(--pb) + 12px)}
.sh-top{display:flex;align-items:center;gap:6px;flex:none;margin-bottom:8px}
.tab{appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px}
.tab[aria-selected="true"]{border-color:var(--good);color:var(--good)}
.sh-x{margin-left:auto}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;-webkit-user-select:text;user-select:text}
.card{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:8px;padding:10px 12px}
.card.off{opacity:.5}
.card.focus{border-color:var(--good);border-left-color:var(--pc)}
.card .body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .nm{font-weight:800;font-size:13px}
.card .cost{font-family:var(--font-mono);font-size:12px;color:var(--good);white-space:nowrap}
.card .ds{font-size:12px;color:var(--muted);line-height:1.4}
.card .gm{font-size:12px;color:var(--good);line-height:1.4}
.card .vs{display:flex;align-items:center;gap:6px;font-size:12px}
.badge{font-family:var(--font-mono);font-size:11px;white-space:nowrap;color:var(--muted)}
.badge.new{color:var(--bg);background:var(--good);padding:1px 6px;border-radius:3px;font-size:10px}
.sq{flex:none;width:40px;height:30px;border-radius:6px;background:var(--surface2);border:2px solid var(--pc);display:grid;place-items:center;font-weight:800;font-size:10px;white-space:nowrap;overflow:hidden}
.ico{flex:none;display:block}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

</head>

  function addBurst(x,y,col,n){if(calm)n=Math.ceil(n/3);for(var i=0;i<n;i++){var a=Math.random()*6.2832,s=30+Math.random()*110;bursts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,col:col});}}

  // ---------- rules ----------
  function inZone(x,y,pred){
    for(var i=0;i<towers.length;i++){var t=towers[i];if(!pred(TOW[t.type]))continue;var p=tc(t);if(Math.hypot(x-p.x,y-p.y)<=tstats(t).range)return true;}
    return false;
  }
  function visibleTo(e,d){if(e.boss||!e.def.hidden)return true;return d.seesHidden||e.inSiem;}
  function progress(e){
    var n=e.path[Math.min(e.seg+1,e.path.length-1)],rem=0;
    for(var i=e.seg+1;i<e.path.length-1;i++)rem+=Math.hypot(e.path[i+1].x-e.path[i].x,e.path[i+1].y-e.path[i].y);
    return -(rem+Math.hypot(n.x-e.x,n.y-e.y));
  }
  function kill(e,byType){
    var i=enemies.indexOf(e);if(i<0)return;
    enemies.splice(i,1);money+=e.rew;stats.stopped++;
    addBurst(e.x,e.y,e.def.col,e.boss?30:10);
    floats.push({x:e.x,y:e.y-12,txt:'+'+e.rew,col:C.lime,life:.8});
    if(e.def.split&&!e.mini&&!e.boss&&byType!=='cs'){
      spawn({t:e.type},e,true);spawn({t:e.type},e,true);
      floats.push({x:e.x,y:e.y+18,txt:'распалась',col:e.def.col,life:.9});
    }
    if(e.boss){haptic('ok');floats.push({x:W/2,y:H*.4,txt:'Целевая атака отражена',col:C.lime,life:2,big:true});}
  }
  function morph(e){
    var ph=bossPhases(),want=Math.min(ph.length-1,Math.floor((1-e.hp/e.max)*ph.length));
    if(want>e.phase){
      e.phase=want;e.type=ph[want];e.def=TH[e.type];
      floats.push({x:e.x,y:e.y-30,txt:'Смена тактики: '+short(TH[e.type].name),col:TH[e.type].col,life:1.6});
      addBurst(e.x,e.y,TH[e.type].col,16);
    }
  }

  function update(dt){
    clock+=dt;shake=Math.max(0,shake-24*dt);flashCore=Math.max(0,flashCore-dt);
    if(banner){banner.life-=dt;if(banner.life<=0)banner=null;}
    var i,k;
    for(i=floats.length-1;i>=0;i--){floats[i].life-=dt;floats[i].y-=22*dt;if(floats[i].life<=0)floats.splice(i,1);}
    for(i=bursts.length-1;i>=0;i--){var b=bursts[i];b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.94;b.vy*=.94;if(b.life<=0)bursts.splice(i,1);}
    for(i=beams.length-1;i>=0;i--){beams[i].life-=dt;if(beams[i].life<=0)beams.splice(i,1);}
    if(state!=='play')return;

    if(!waveOn&&wave<sc.waves){countdown-=dt;if(countdown<=0)startWave(false);}
    if(waveOn&&queue.length){
      spawnT-=dt;
      if(spawnT<=0){var it=queue.shift();spawn(it);spawnT=it.gap!==undefined?it.gap:Math.max(.35,.85-wave*.025);}
    }
    for(i=0;i<towers.length;i++)if(towers[i].off>0)towers[i].off-=dt;

    for(i=enemies.length-1;i>=0;i--){
      var e=enemies[i];e.age+=dt;e.shield=Math.max(0,e.shield-dt);
      e.inSiem=inZone(e.x,e.y,function(d){return !!d.reveals;});
      var sp=e.spd*(e.slowT>0?.5:1);if(e.slowT>0)e.slowT-=dt;
      var mv=sp*dt;
      while(mv>0&&e.seg<e.path.length-1){
        var tx=e.path[e.seg+1].x,ty=e.path[e.seg+1].y,dx=tx-e.x,dy=ty-e.y,dist=Math.hypot(dx,dy);
        if(dist<=mv){e.x=tx;e.y=ty;e.seg++;mv-=dist;}else{e.x+=dx/dist*mv;e.y+=dy/dist*mv;mv=0;}
      }
      if(e.type==='ransom'){
        for(k=0;k<towers.length;k++){
          var tw=towers[k],tp=tc(tw),key=tw.c+','+tw.r;
          if(e.hitT[key])continue;
          if(Math.hypot(tp.x-e.x,tp.y-e.y)<=50){
            e.hitT[key]=1;
            var prot=TOW[tw.type].protects||inZone(tp.x,tp.y,function(d){return !!d.protects;});
            if(prot)floats.push({x:tp.x,y:tp.y-14,txt:'защищено EDR',col:TH.ransom.col,life:.9});
            else{tw.off=4;floats.push({x:tp.x,y:tp.y-14,txt:'зашифровано',col:TH.ransom.col,life:.9});}
          }
        }
      }
      if(e.seg>=e.path.length-1){
        enemies.splice(i,1);
        var hit=e.boss?35:(e.mini?Math.ceil(e.def.dmg/2):e.def.dmg);
        integrity-=hit;flashCore=.35;shake=calm?0:7;haptic('hit');
        if(e.boss)stats.bossLeak=true;
        else{stats.miss[e.type]=(stats.miss[e.type]||0)+1;stats.missDmg[e.type]=(stats.missDmg[e.type]||0)+hit;}
        floats.push({x:(CORE.c+.5)*CS,y:CORE.r*CS-4,txt:'-'+hit+' '+(e.boss?'целевая атака':short(e.def.name).toLowerCase()),col:e.def.col,life:1.1});
        if(integrity<=0){integrity=0;finish(false);return;}
      }
    }
    for(i=0;i<towers.length;i++){
      var t=towers[i],d=TOW[t.type];
      if(t.off>0)continue;
      var s=tstats(t);
      t.cd-=dt;if(t.cd>0)continue;
      var p=tc(t),cands=[];
      for(k=0;k<enemies.length;k++){
        var en=enemies[k];
        if(!visibleTo(en,d))continue;
        if(Math.hypot(en.x-p.x,en.y-p.y)<=s.range)cands.push({e:en,score:(en.type===d.counter?1e6:0)+progress(en)});
      }
      if(!cands.length)continue;
      cands.sort(function(a,b){return b.score-a.score;});
      t.cd=s.rate;
      var n=d.multi||1;
      for(k=0;k<Math.min(n,cands.length);k++){
        var tg2=cands[k].e,match=tg2.type===d.counter,armored=!!tg2.def.armor&&!tg2.boss;
        var mul=armored?ARMOR:(match?1:(tg2.boss?BOSS_MISMATCH:MISMATCH));
        var dealt=Math.min(Math.max(0,tg2.hp),s.dmg*mul);
        tg2.hp-=s.dmg*mul;
        if(!armored){stats.total+=dealt;if(match)stats.match+=dealt;}
        if(d.slow&&!tg2.boss)tg2.slowT=1.2;
        if(!match&&!armored)tg2.shield=.18;
        beams.push({x1:p.x,y1:p.y,x2:tg2.x,y2:tg2.y,life:.11,col:match||armored?tcol(t.type):null});
        if(tg2.hp<=0)kill(tg2,t.type);
        else if(tg2.boss)morph(tg2);
      }
    }
    if(waveOn&&!queue.length&&!enemies.length){
      waveOn=false;
      if(df.wear)towers.forEach(function(t){t.fresh=Math.max(0,Math.round((t.fresh-df.wearRate)*100)/100);});
      if(wave>=sc.waves){finish(true);return;}
      var bonus=Math.round((15+wave*5)*df.bonus);money+=bonus;countdown=df.timer;
      floats.push({x:W/2,y:H*.47,txt:'Волна '+wave+' отражена  +'+bonus,col:C.lime,life:1.8,big:true});
      renderNext();renderInfo();
    }
  }

  // ---------- drawing ----------
  function drawIcon(k,x,y,size,col){
    if(!paths[k])return;
    ctx.save();ctx.translate(x,y);var s=size/24;ctx.scale(s,s);ctx.translate(-12,-12);
    ctx.strokeStyle=col;ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(paths[k]);ctx.restore();
  }
  function drawEnemy(e){
    var hidden=e.def.hidden&&!e.boss&&!e.inSiem&&!inZone(e.x,e.y,function(d){return !!d.seesHidden;});
    ctx.save();
    if(hidden)ctx.globalAlpha=.3+.1*Math.sin(clock*4);
    ctx.fillStyle=e.boss?C.boss:e.def.col;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.2832);ctx.fill();
    if(e.boss){ctx.fillStyle=e.def.col;ctx.beginPath();ctx.arc(e.x,e.y,e.r-6,0,6.2832);ctx.fill();ctx.strokeStyle=C.lime;ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,6.2832);ctx.stroke();}
    else if(e.def.armor){ctx.strokeStyle=e.def.col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,6.2832);ctx.stroke();}
    drawIcon(e.type,e.x,e.y,e.r*(e.boss?1:1.25),C.navy);
    if(hidden){ctx.setLineDash([3,3]);ctx.strokeStyle=C.ink;ctx.lineWidth=1;ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,6.2832);ctx.stroke();ctx.setLineDash([]);}
    ctx.restore();
    if(e.shield>0){ctx.strokeStyle='rgba(238,242,255,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,0,6.2832);ctx.stroke();}
    if(e.slowT>0){ctx.strokeStyle=TH.scan.col;ctx.lineWidth=1;ctx.beginPath();ctx.arc(e.x,e.y,e.r+2,0,6.2832);ctx.stroke();}
    if(!hidden){
      var bw=e.r*2+6,pct=Math.max(0,e.hp/e.max);
      ctx.fillStyle='rgba(10,18,48,.85)';ctx.fillRect(e.x-bw/2,e.y-e.r-10,bw,4);
      ctx.fillStyle=pct>.4?C.lime:C.orange;ctx.fillRect(e.x-bw/2,e.y-e.r-10,bw*pct,4);
    }
  }
  function drawTower(t,sel){
    var x=t.c*CS,y=t.r*CS,d=TOW[t.type],col=tcol(t.type);
    ctx.save();
    if(t.off>0)ctx.globalAlpha=.4;
    ctx.fillStyle=C.deep;rr(x+3,y+3,CS-6,CS-6,7);ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=2.5;rr(x+3,y+3,CS-6,CS-6,7);ctx.stroke();
    ctx.fillStyle=col;rr(x+7,y+6,CS-14,4,2);ctx.fill();
    ctx.fillStyle=C.ink;ctx.font='800 '+(d.abbr.length>3?10:12)+'px Manrope,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(d.abbr,x+CS/2,y+CS/2+1);
    var wb=df.wear;
    ctx.fillStyle=C.lime;
    for(var l=0;l<t.lv;l++){ctx.beginPath();ctx.arc(x+CS/2-7+l*7,y+(wb?CS-12:CS-9),2.2,0,6.2832);ctx.fill();}
    if(wb){var bw=CS-16;ctx.fillStyle='rgba(147,160,207,.25)';ctx.fillRect(x+8,y+CS-8,bw,3);ctx.fillStyle=freshCol(t.fresh);ctx.fillRect(x+8,y+CS-8,bw*Math.max(0,t.fresh),3);}
    ctx.restore();
    if(t.off>0)drawIcon('ransom',x+CS-8,y+8,12,TH.ransom.col);
    if(sel){ctx.strokeStyle=C.lime;ctx.lineWidth=2;rr(x,y,CS,CS,9);ctx.stroke();}
  }
  function ring(cx,cy,rad,stroke,fill,dash){
    ctx.save();if(dash)ctx.setLineDash(dash);ctx.strokeStyle=stroke;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,6.2832);if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.stroke();ctx.restore();
  }
  function wrapText(text,maxW){
    var words=text.split(' '),lines=[],line='';
    for(var i=0;i<words.length;i++){var t=line?line+' '+words[i]:words[i];if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=words[i];}else line=t;}
    if(line)lines.push(line);return lines;
  }
  function drawRoute(P,col,dash){
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash(dash);
    ctx.beginPath();ctx.moveTo(P[0].x,P[0].y);for(var i=1;i<P.length;i++)ctx.lineTo(P[i].x,P[i].y);ctx.stroke();ctx.setLineDash([]);
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=C.navy;ctx.fillRect(0,0,W,H);
    ctx.save();
    if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    var c,r,i,key,playing=state==='play'||state==='pause';
    var bOpen=playing?wave+(waveOn?0:1)>=sc.second:false;
    for(c=0;c<COLS;c++)for(r=0;r<ROWS;r++){
      key=c+','+r;
      if(onPath[key]){ctx.fillStyle='#101a40';ctx.fillRect(c*CS,r*CS,CS,CS);}
      else if(onB[key]){ctx.fillStyle=bOpen?'#101a40':'rgba(16,26,64,.45)';ctx.fillRect(c*CS,r*CS,CS,CS);}
      else if(pads[key]){ctx.strokeStyle=selShop?'rgba(175,251,51,.5)':'rgba(147,160,207,.3)';ctx.lineWidth=selShop?2:1;rr(c*CS+5,r*CS+5,CS-10,CS-10,6);ctx.stroke();}
      else{ctx.fillStyle='rgba(147,160,207,.12)';ctx.fillRect(c*CS+CS/2-1,r*CS+CS/2-1,2,2);}
    }
    drawRoute(PA,'rgba(255,143,12,.3)',[6,8]);
    drawRoute(PB,bOpen?'rgba(255,143,12,.3)':'rgba(147,160,207,.15)',[3,9]);
    ctx.font='500 12px "JetBrains Mono",monospace';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle=C.muted;
    ctx.fillText('ВХОД',3*CS+4,16);
    ctx.textAlign='right';ctx.fillText(bOpen?'ВХОД 2':'ВХОД 2 · С '+sc.second+'-Й',W-4,CS*2+14);
    ctx.textAlign='left';ctx.fillText('ЯДРО',6*CS+4,15*CS+26);
    if(playing&&inScenario('lateral')){
      var mp=PA[MID_I];ctx.strokeStyle=TH.lateral.col;ctx.globalAlpha=.55;ctx.setLineDash([2,3]);ctx.beginPath();ctx.arc(mp.x,mp.y,16,0,6.2832);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
      ctx.fillStyle=C.muted;ctx.fillText('ЗАРАЖЁННЫЙ УЗЕЛ',mp.x-16,mp.y+34);
    }
    var cx=(CORE.c+.5)*CS,cy=(CORE.r+.5)*CS;
    var g=ctx.createRadialGradient(cx,cy,2,cx,cy,70);
    g.addColorStop(0,flashCore>0?'rgba(255,143,12,.55)':'rgba(33,118,255,.5)');g.addColorStop(1,'rgba(33,118,255,0)');
    ctx.fillStyle=g;ctx.fillRect(cx-80,cy-80,160,160);
    ctx.fillStyle=flashCore>0?C.orange:C.blue;rr(cx-17,cy-17,34,34,8);ctx.fill();
    ctx.fillStyle=C.lime;ctx.beginPath();ctx.arc(cx,cy,6,0,6.2832);ctx.fill();

    for(i=0;i<towers.length;i++){
      var tt=TOW[towers[i].type],tp=tc(towers[i]),rg=tstats(towers[i]).range;
      if(tt.reveals)ring(tp.x,tp.y,rg,'rgba(255,77,94,.3)','rgba(255,77,94,.04)',[4,6]);
      else if(tt.protects)ring(tp.x,tp.y,rg,'rgba(214,163,106,.3)',null,[4,6]);
    }
    for(i=0;i<towers.length;i++)drawTower(towers[i],selTower===towers[i]);
    if(selTower){var sp3=tc(selTower);ring(sp3.x,sp3.y,tstats(selTower).range,'rgba(175,251,51,.9)','rgba(175,251,51,.07)');}
    for(i=0;i<beams.length;i++){
      var bm=beams[i];
      if(bm.col){ctx.strokeStyle=bm.col;ctx.lineWidth=3;}else{ctx.strokeStyle='rgba(147,160,207,.55)';ctx.lineWidth=1;}
      ctx.beginPath();ctx.moveTo(bm.x1,bm.y1);ctx.lineTo(bm.x2,bm.y2);ctx.stroke();
    }
    for(i=0;i<enemies.length;i++)drawEnemy(enemies[i]);
    for(i=0;i<bursts.length;i++){var q=bursts[i];ctx.globalAlpha=Math.max(0,q.life/.45);ctx.fillStyle=q.col;ctx.fillRect(q.x-2,q.y-2,4,4);}
    ctx.globalAlpha=1;ctx.textBaseline='alphabetic';ctx.textAlign='center';
    for(i=0;i<floats.length;i++){
      var f=floats[i];ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.col;
      ctx.font=f.big?'700 19px Unbounded,Manrope,sans-serif':'700 14px Manrope,sans-serif';
      ctx.fillText(f.txt,Math.min(W-80,Math.max(80,f.x)),f.y);
    }
    ctx.globalAlpha=1;
    ctx.restore();

    if(playing&&!waveOn&&wave<sc.waves){
      ctx.font='700 15px Manrope,sans-serif';ctx.textAlign='center';ctx.fillStyle=countdown<6?C.orange:C.ink;
      ctx.fillText('Волна '+(wave+1)+' через '+Math.ceil(countdown)+' с',W/2,CS*1.6);
    }
    if(banner){
      var bx=16,by=H*.28,bw2=W-32,bc=banner.k==='boss'?C.boss:(banner.k?TH[banner.k].col:C.ink);
      ctx.font='600 15px Manrope,sans-serif';
      var lines=wrapText(banner.text,bw2-84);
      var bh=74+lines.length*20;
      ctx.globalAlpha=Math.min(1,banner.life*1.5);
      ctx.fillStyle='rgba(10,18,48,.95)';rr(bx,by,bw2,bh,10);ctx.fill();
      ctx.strokeStyle=bc;ctx.lineWidth=2;rr(bx,by,bw2,bh,10);ctx.stroke();
      ctx.fillStyle=bc;ctx.beginPath();ctx.arc(bx+34,by+38,20,0,6.2832);ctx.fill();
      if(banner.k)drawIcon(banner.k,bx+34,by+38,24,C.navy);
      else{ctx.fillStyle=C.navy;ctx.font='800 18px Manrope,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',bx+34,by+39);ctx.textBaseline='alphabetic';}
      ctx.textAlign='left';ctx.fillStyle=bc;ctx.font='700 16px Unbounded,Manrope,sans-serif';
      ctx.fillText(banner.title,bx+66,by+32,bw2-80);
      ctx.fillStyle=C.ink;ctx.font='600 15px Manrope,sans-serif';
      for(i=0;i<lines.length;i++)ctx.fillText(lines[i],bx+66,by+56+i*20);
      ctx.fillStyle=C.lime;ctx.font='700 15px Manrope,sans-serif';
      ctx.fillText(banner.hint,bx+66,by+58+lines.length*20+4,bw2-80);
      ctx.globalAlpha=1;
    }
  }

  // ---------- input ----------
  function cellOf(e){
    var r=cv.getBoundingClientRect();
    return{c:Math.floor((e.clientX-r.left)*W/r.width/CS),r:Math.floor((e.clientY-r.top)*H/r.height/CS)};
  }
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();
    if(state!=='play')return;
    var p=cellOf(e),t=towerAt(p.c,p.r);
    if(t){selTower=t;selShop=null;haptic('tap');renderInfo();return;}
    if(!pads[p.c+','+p.r]){if(selTower){selTower=null;renderInfo();}return;}
    if(!selShop){selTower=null;renderInfo();floats.push({x:(p.c+.5)*CS,y:p.r*CS,txt:'Сначала выберите решение внизу',col:C.muted,life:1});return;}
    var d=TOW[selShop];
    if(money<d.cost){floats.push({x:(p.c+.5)*CS,y:p.r*CS,txt:'Не хватает бюджета',col:C.orange,life:.9});haptic('bad');return;}
    money-=d.cost;
    towers.push({type:selShop,c:p.c,r:p.r,lv:1,cd:0,spent:d.cost,fresh:1,off:0});
    addBurst((p.c+.5)*CS,(p.r+.5)*CS,tcol(selShop),6);haptic('tap');
    renderInfo();
  });
  cv.addEventListener('contextmenu',function(e){e.preventDefault();});
  $('wavebtn').addEventListener('click',function(){startWave(true);});
  $('speed').addEventListener('click',function(){speed=speed===1?2:1;this.textContent='×'+speed;this.setAttribute('aria-pressed',speed===2?'true':'false');});
  $('pausebtn').addEventListener('click',function(){if(state==='play')pauseGame();else if(state==='pause'&&!silentPause)resumeGame();});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play')pauseGame();});

  // ---------- HUD ----------
  var L={};
  function setTxt(id,v){if(L[id]!==v){$(id).textContent=v;L[id]=v;}}
  function hud(){
    var playing=state==='play'||state==='pause';
    setTxt('wave',playing||state==='over'?wave+'/'+sc.waves:'—');
    if(L.money!==money){L.money=money;$('money').textContent=money;syncDock();
      var u=$('upb');if(u&&selTower)u.disabled=(selTower.lv>=3||money<upCost(selTower));
      var rf=$('rfb');if(rf&&selTower)rf.disabled=money<refreshCost(selTower);}
    setTxt('timer',state==='pause'?'пауза':!playing?'—':(waveOn?'идёт':(wave>=sc.waves?'—':Math.ceil(countdown)+' с')));
    var iv=Math.round(integrity);
    if(L.int!==iv){L.int=iv;$('intText').textContent=iv+'%';var f=$('intFill');f.style.width=iv+'%';f.classList.toggle('low',iv<35);}
    var wb=$('wavebtn'),html;
    if(!playing)html='Волна';
    else if(waveOn)html='Волна '+wave+'<span class="sb">идёт</span>';
    else if(wave>=sc.waves)html='Готово';
    else html='Волна '+(wave+1)+(countdown>1?'<span class="sb">сейчас +'+Math.ceil(countdown)*2+'</span>':'');
    if(L.wb!==html){wb.innerHTML=html;L.wb=html;}
    var dis=waveOn||state!=='play';
    if(L.dis!==dis){wb.disabled=dis;L.dis=dis;}
  }

  showMenu();fit();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  setTimeout(fit,300);
  last=performance.now();
  function frame(now){
    var dt=Math.min(.1,(now-last)/1000);last=now;
    for(var s=0;s<speed;s++)update(dt);
    draw();hud();requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__ec={
    get:function(){return{state:state,wave:wave,money:money,integrity:integrity,towers:towers.length,enemies:enemies.length,waveOn:waveOn,acc:stats&&stats.total?stats.match/stats.total:1,miss:stats?stats.miss:{},boss:stats?stats.bossLeak:false};},
    next:function(){var c={};nextQ.forEach(function(q){c[q.t]=(c[q.t]||0)+1;});return c;},
    pads:padList,towers:function(){return towers;},start:start,pick:function(k){selShop=k;selTower=null;renderInfo();},
    hurt:function(v){integrity=v;},up:doUpgrade,refresh:doRefresh,startWave:function(){startWave(true);},sc:function(){return sc;}
  };
})();
</script>
</body>
