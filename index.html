<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Puzzle Defender</title>
<meta name="theme-color" content="#0a1230">
<meta name="format-detection" content="telephone=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Mobile-first layout for Telegram Mini App: one screen, no page scroll.
   Top bar, stat strip with pause, integrity meter, then the playfield fills the rest.
   Start/pause/result screens and the threat & bonus guide open full-screen above the game. */
:root{
  --bg:#0a1230;
  --surface:#101a40;
  --surface2:#16245a;
  --line:#22306a;
  --fg:#eef2ff;
  --muted:#93a0cf;
  --threat:#ff8f0c;
  --good:#affb33;
  --core:#2176ff;
  --font-display:"Unbounded","Arial Black",sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sa-top:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px));
  --sa-bottom:calc(env(safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px) + var(--tg-safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;-webkit-tap-highlight-color:transparent}

.app{
  height:var(--app-h,100vh);height:var(--app-h,100dvh);
  max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;gap:8px;
  padding:calc(8px + var(--sa-top)) max(12px,env(safe-area-inset-right,0px)) calc(10px + var(--sa-bottom)) max(12px,env(safe-area-inset-left,0px));
}
.top{display:flex;align-items:center;gap:10px;flex:none}
.mark{width:26px;height:26px;flex:none;display:block}
.top h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{appearance:none;cursor:pointer;width:40px;height:40px;flex:none;display:grid;place-items:center;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:0}
.icon-btn:active{background:var(--surface)}
.icon-btn[disabled]{opacity:.35}
.icon-btn[aria-pressed="true"]{border-color:var(--good);color:var(--good)}

.hud{display:grid;grid-template-columns:repeat(3,1fr) auto;align-items:center;gap:0;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px}
.stat{display:flex;flex-direction:column;gap:0;padding-left:10px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{padding-left:0;border-left:0}
.k{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.v{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.meter{display:flex;align-items:center;gap:10px;flex:none}
.meter span{font-size:11px;color:var(--muted);white-space:nowrap}
.meter b{font-family:var(--font-mono);font-weight:500;font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.track{flex:1;height:8px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:100%;background:var(--good);transition:width .25s ease,background-color .25s ease}
.fill.low{background:var(--threat)}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.field{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);width:100%;aspect-ratio:3/4}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* full-screen screens: start, pause, result */
.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(20px + var(--sa-top)) 20px calc(20px + var(--sa-bottom));background:rgba(10,18,48,.94);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ov{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;width:100%;max-width:400px}
.logo-full{height:30px;width:auto;display:block;margin-bottom:6px}
.ov h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.2;text-wrap:balance}
.ov p{margin:0;color:var(--muted);font-size:14px}
.ov p b{color:var(--fg)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{
  appearance:none;border:0;cursor:pointer;
  background:var(--good);color:var(--bg);
  font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.02em;
  min-height:52px;padding:14px 22px;border-radius:10px;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--good);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.acts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:4px}
.acts .btn{width:100%}
.how{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;margin:4px 0}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface);border-radius:8px;padding:9px 11px}
.how b{color:var(--fg)}
.how i{flex:none;font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--bg)}
.stars{font-size:30px;letter-spacing:6px;color:var(--good);line-height:1}
.stars i{font-style:normal;color:var(--line)}
.rep{display:grid;grid-template-columns:1fr auto;gap:5px 14px;margin:0;width:100%;font-size:13px;text-align:left;background:var(--surface);border-radius:10px;padding:12px 14px}
.rep dt{color:var(--muted)}
.rep dd{margin:0;font-family:var(--font-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.recs{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.rec{border-left:3px solid var(--pc);background:var(--surface);padding:10px 12px;border-radius:6px;font-size:12.5px;color:var(--muted);line-height:1.45;-webkit-user-select:text;user-select:text}
.rec b{color:var(--fg)}
.rec .pz{display:block;margin-top:6px;color:var(--fg)}
.rec .pz a{color:var(--good);font-weight:700}

/* guide: threats & bonuses */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--sa-top)}
.sheet-top{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-top h2{margin:0;flex:1;font-family:var(--font-display);font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;flex:none}
.tab{appearance:none;cursor:pointer;min-height:40px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:13px}
.tab[aria-selected="true"]{background:var(--surface2);color:var(--fg);border-color:var(--surface2)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 12px calc(16px + var(--sa-bottom))}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:10px;padding:11px 12px}
.list b{display:block;font-size:14px;line-height:1.3}
.list small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:3px}
.list em{display:block;font-style:normal;color:var(--good);font-size:12.5px;line-height:1.4;margin-top:4px}
.list .tag{display:inline-block;font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.06em;margin-top:4px}
.dot{flex:none;width:14px;height:14px;border-radius:50%;margin-top:3px}
.chip{flex:none;min-width:56px;text-align:center;background:var(--good);color:var(--bg);font-family:var(--font-display);font-weight:700;font-size:10px;padding:5px 6px;border-radius:4px;margin-top:1px}

@media (min-height:760px){
  .v{font-size:19px}
  .app{gap:10px}
}
@media (max-width:360px){
  .meter span{display:none}
  .v{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .fill,.btn{transition:none}
}
</style>
</head>

  function weighted(list){

    var r=Math.random()*sum;for(i=0;i<list.length;i++){r-=list[i][1];if(r<=0)return list[i][0];}
    return list[0][0];

    return weighted(l);

  function edrShot(){

    for(i=0;i<threats.length;i++){var th=threats[i];if(th.y>0&&acctVis(th)&&th.y>ly){ly=th.y;tg=th;}}

  function hitBoss(n){

    boss.hp-=n;boss.flash=.1;

  function acctVis(t){return t.kind!=='acct'||slowT>0||eff.pam>0||Math.sin(t.age*2.6+t.ph)>-.15;}
  function hit(x,y){
    if(state!=='play')return;
    stats.clicks++;
    var i;
    for(i=picks.length-1;i>=0;i--){
      var p=picks[i];
      if(Math.hypot(p.x-x,p.y-y)<p.r+22){picks.splice(i,1);stats.hits++;collect(p);return;}

    var bi=-1,bd=1e9;
    for(i=threats.length-1;i>=0;i--){
      var tt=threats[i];
      if(!acctVis(tt))continue;
      var dd=Math.hypot(tt.x-x,tt.y-y);
      if(dd<tt.def.r+20&&dd-tt.def.r<bd){bd=dd-tt.def.r;bi=i;}
    }
    if(bi>=0){
      i=bi;var t=threats[i];
      {
        stats.hits++;
        t.hp--;t.flash=.08;
        if(t.hp<=0){threats.splice(i,1);kill(t);}
        else{burst(t.x,t.y,6,t.def.col);shock(t.x,t.y,t.def.col,t.def.r+12);}
        return;

    if(boss&&Math.hypot(boss.x-x,boss.y-y)<boss.r+18){buzz('impact','medium');stats.hits++;combo++;if(combo>bestCombo)bestCombo=combo;hitBoss(1);return;}
    rings.push({x:x,y:y,life:.3});
  }

      '<dt>Целостность периметра</dt><dd>'+Math.max(0,Math.round(integrity))+'%</dd>'+
      '<dt>Угроз нейтрализовано</dt><dd>'+stats.stopped+'</dd>'+
      '<dt>Прорвалось к периметру</dt><dd>'+stats.breaches+'</dd>'+

    $('overlay').hidden=false;$('overlay').scrollTop=0;
    setTimeout(function(){try{$(win?'endless':'again').focus({preventScroll:true});}catch(e){}},350);
  }

  function plural(n,f1,f2,f5){var m=n%100,d=n%10;if(m>10&&m<20)return f5;if(d===1)return f1;if(d>=2&&d<=4)return f2;return f5;}
  function recsHTML(){

      else txt=many?'Вы пропустили большое количество атак «'+t.name+'»':'Вы пропустили '+n+' '+plural(n,'атаку','атаки','атак')+' «'+t.name+'»';

  function pauseGame(){

    $('ov').innerHTML='<span class="lbl">Пауза</span><h2>Игра на паузе</h2><p>Волна '+wave+(endless?'':' из '+WAVES)+'. Счёт '+score+', целостность '+Math.round(integrity)+'%.</p>'+
      '<div class="acts"><button class="btn" id="resume" type="button">Продолжить</button><button class="btn ghost" id="infoP" type="button">Угрозы и бонусы</button><button class="btn ghost" id="restart" type="button">Начать заново</button></div>';
    $('infoP').addEventListener('click',openSheet);
    $('resume').addEventListener('click',resumeGame);
    $('restart').addEventListener('click',reset);

  }
  function resumeGame(){
    if(state!=='pause')return;
    state='play';$('overlay').hidden=true;$('pausebtn').setAttribute('aria-pressed','false');last=performance.now();
  }

  function update(dt){
    clock+=dt;
    breachFlash=Math.max(0,breachFlash-dt);
    shake=Math.max(0,shake-30*dt);
    banner=Math.max(0,banner-dt);
    pamFlash=Math.max(0,pamFlash-dt);healFlash=Math.max(0,healFlash-dt);comboPop=Math.max(0,comboPop-dt*1.5);
    var i;
    for(i=0;i<rain.length;i++){var rd=rain[i];rd.y+=rd.s*dt*(slowT>0&&state==='play'?.4:1);if(rd.y>H+10){rd.y=-10;rd.x=Math.random()*W;rd.ch=Math.random()<.5?'0':'1';}}
    for(i=parts.length-1;i>=0;i--){
      var q=parts[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;
      if(q.life<=0)parts.splice(i,1);
    }
    for(i=floats.length-1;i>=0;i--){var f=floats[i];f.life-=dt;f.y-=30*dt;if(f.life<=0)floats.splice(i,1);}
    for(i=rings.length-1;i>=0;i--){rings[i].life-=dt;if(rings[i].life<=0)rings.splice(i,1);}
    for(i=waves.length-1;i>=0;i--){waves[i].life-=dt;if(waves[i].life<=0)waves.splice(i,1);}
    if(state!=='play')return;

    elapsed+=dt;
    var nw=1+Math.floor(elapsed/WAVE_LEN);
    if(!endless)nw=Math.min(WAVES,nw);
    if(nw!==wave){
      wave=nw;banner=1.8;
      var spd=Math.round(((72+(wave-1)*7)/72-1)*100);
      bannerSub=NEWAT[wave]&&!endless?'Новая угроза: '+TYPES[NEWAT[wave]].name.replace(/ \(.*\)/,'')+' — '+TRAIT[NEWAT[wave]]:'Скорость угроз +'+spd+'%';
      if(wave===WAVES&&!endless)spawnBoss();
    }
    if(slowT>0)slowT-=dt;
    for(var ek in eff)if(eff[ek]>0)eff[ek]=Math.max(0,eff[ek]-dt);
    for(i=beams.length-1;i>=0;i--){beams[i].life-=dt;if(beams[i].life<=0)beams.splice(i,1);}
    for(i=tels.length-1;i>=0;i--){tels[i].t-=dt;if(tels[i].t<=0){addThreat('supply',tels[i].x,tels[i].y);tels.splice(i,1);}}
    if(eff.edr>0){
      edrT-=dt;
      if(edrT<=0){edrT=.45;edrShot();}
    }
    var slow=(slowT>0?0.4:1)*(eff.nad>0?.75:1);
    var base=(72+(wave-1)*7)*(LINE/548);

    var bossWave=boss&&!endless;
    spawnT-=dt;
    if(spawnT<=0){spawn();spawnT=Math.max(0.4,1.2-(wave-1)*0.06)*rand(.7,1.3)*(bossWave?1.8:1);}
    pickT-=dt;
    if(pickT<=0){spawnPick();pickT=rand(12,20);}

    if(boss){
      boss.age+=dt;boss.flash-=dt;
      if(boss.y<150)boss.y+=40*slow*dt;
      boss.x=W/2+Math.sin(boss.age*.8)*150;
      boss.shootT-=dt*slow;
      if(boss.shootT<=0){
        boss.shootT=Math.max(.9,2.2-(1-boss.hp/boss.max)*1.2);
        var m=addThreat('minion',boss.x+rand(-20,20),boss.y+boss.r);
      }
    }

    for(i=threats.length-1;i>=0;i--){
      var t=threats[i];
      t.age+=dt;t.flash-=dt;
      t.y+=base*t.def.speed*slow*dt*(t.kind==='vuln'?1+t.age*.12:1);
      if(eff.nad<=0){
        if(t.kind==='virus')t.x=Math.min(W-24,Math.max(24,t.x0+Math.sin(t.age*3+t.ph)*22));
        else if(t.kind==='scan')t.x=Math.min(W-24,Math.max(24,t.x0+Math.sin(t.age*1.1+t.ph)*110));
        else if(t.kind==='lateral'){
          t.hopT-=dt;
          if(t.hopT<=0){t.hopT=rand(.9,1.4);var nx=t.x0+(Math.random()<.5?-1:1)*rand(70,120);if(nx<40||nx>W-40)nx=t.x0-(nx-t.x0);t.x0=Math.min(W-30,Math.max(30,nx));}
          t.x+=(t.x0-t.x)*Math.min(1,dt*10);
        }
      }
      if(!calm){t.trail.push(t.x,t.y);if(t.trail.length>12)t.trail.splice(0,2);}
      if(t.y>=LINE){
        threats.splice(i,1);
        if(eff.ngfw>0){kill(t,true);shock(t.x,LINE,C.lime,40);continue;}
        if(bck>0){bck--;combo=0;float(t.x,LINE-10,'Container Security: прорыв отражён',C.lime);shock(t.x,LINE,C.lime,50);continue;}
        if(t.kind==='minion')stats.bossMiss=true;else stats.miss[t.kind]=(stats.miss[t.kind]||0)+1;
        breach(t.def.dmg,t.x,t.def.col);if(state!=='play')return;
      }
    }
    for(i=picks.length-1;i>=0;i--){
      var p=picks[i];p.age+=dt;p.y+=55*(LINE/548)*dt;
      if(p.y>H+40)picks.splice(i,1);
    }
  }

  function wrapText(txt,x,y,maxW,lh){
    if(ctx.measureText(txt).width<=maxW){ctx.fillText(txt,x,y);return;}
    var words=txt.split(' '),line='',out=[];
    for(var i=0;i<words.length;i++){var test=line?line+' '+words[i]:words[i];if(ctx.measureText(test).width>maxW&&line){out.push(line);line=words[i];}else line=test;}
    out.push(line);
    for(var j=0;j<out.length;j++)ctx.fillText(out[j],x,y+j*lh);
  }
  function glow(col,blur){if(!calm){ctx.shadowColor=col;ctx.shadowBlur=blur;}}
  function noGlow(){ctx.shadowBlur=0;}

  function drawThreat(t){
    var d=t.def,col=t.flash>0?'#ffffff':d.col;
    if(!acctVis(t)){
      ctx.save();ctx.globalAlpha=.16;ctx.strokeStyle=d.col;ctx.setLineDash([3,4]);ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(t.x,t.y,d.r+2,0,6.2832);ctx.stroke();ctx.restore();return;
    }
    if(t.trail.length>2){
      ctx.strokeStyle=d.col;ctx.lineCap='round';
      for(var j=2;j<t.trail.length;j+=2){
        ctx.globalAlpha=j/t.trail.length*.25;ctx.lineWidth=d.r*.6*j/t.trail.length;
        ctx.beginPath();ctx.moveTo(t.trail[j-2],t.trail[j-1]);ctx.lineTo(t.trail[j],t.trail[j+1]);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    ctx.save();
    ctx.translate(t.x,t.y);
    glow(d.col,16);
    ctx.fillStyle=col;ctx.strokeStyle=col;
    if(t.kind==='phish'){
      rr(-22,-15,44,30,5);ctx.fill();noGlow();
      ctx.strokeStyle=C.navy;ctx.lineWidth=2.5;ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(-19,-11);ctx.lineTo(0,4);ctx.lineTo(19,-11);ctx.stroke();
    }else if(t.kind==='virus'){
      ctx.beginPath();ctx.arc(0,0,13,0,6.2832);ctx.fill();
      ctx.lineWidth=4;ctx.lineCap='round';
      var rot=calm?0:t.age*1.5;
      for(var i=0;i<8;i++){
        var a=rot+i*Math.PI/4;
        ctx.beginPath();ctx.moveTo(Math.cos(a)*14,Math.sin(a)*14);ctx.lineTo(Math.cos(a)*21,Math.sin(a)*21);ctx.stroke();
      }
      noGlow();ctx.fillStyle=C.navy;
      [[-4,-3],[4,-3],[0,4]].forEach(function(c){ctx.beginPath();ctx.arc(c[0],c[1],2.2,0,6.2832);ctx.fill();});
    }else if(t.kind==='leak'){
      ctx.beginPath();ctx.moveTo(0,-22);
      ctx.bezierCurveTo(8,-10,16,-2,16,7);
      ctx.arc(0,7,16,0,Math.PI,false);
      ctx.bezierCurveTo(-16,-2,-8,-10,0,-22);
      ctx.closePath();ctx.fill();noGlow();
      ctx.strokeStyle=C.navy;ctx.lineWidth=2.5;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(0,7,8,Math.PI*.15,Math.PI*.7,false);ctx.stroke();
    }else if(ICONS[t.kind]!==undefined){
      ctx.beginPath();ctx.arc(0,0,d.r,0,6.2832);ctx.fill();noGlow();
      if(ICONS[t.kind]){ctx.save();var sc=d.r*1.25/24;ctx.scale(sc,sc);ctx.translate(-12,-12);ctx.strokeStyle=C.navy;ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(ICONS[t.kind]);ctx.restore();}
    }else if(t.kind==='ddos'||t.kind==='minion'){
      ctx.rotate(calm?0:t.age*2);
      ctx.beginPath();
      for(var k=0;k<6;k++){
        var b=k*Math.PI/3+Math.PI/6;
        var px=Math.cos(b)*d.r,py=Math.sin(b)*d.r;
        if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.closePath();ctx.fill();noGlow();
      ctx.fillStyle=C.navy;ctx.fillRect(-3,-3,6,6);
    }else{
      ctx.lineWidth=7;ctx.lineCap='butt';
      ctx.beginPath();ctx.arc(0,-8,15,Math.PI,0,false);ctx.stroke();
      rr(-28,-8,56,40,8);ctx.fill();noGlow();
      ctx.fillStyle=C.navy;
      ctx.beginPath();ctx.arc(0,10,6,0,6.2832);ctx.fill();
      ctx.fillRect(-2.5,12,5,10);
      for(var h=0;h<3;h++){
        ctx.beginPath();ctx.arc((h-1)*12,-34,3.2,0,6.2832);
        if(h<t.hp){ctx.fillStyle=d.col;ctx.fill();}
        else{ctx.strokeStyle='rgba(214,163,106,.4)';ctx.lineWidth=1.5;ctx.stroke();}
      }
    }
    noGlow();
    ctx.restore();
    if(d.label){
      ctx.font='800 11px Manrope,sans-serif';
      var tw=ctx.measureText(d.label).width+10;
      ctx.fillStyle='rgba(10,18,48,.75)';rr(t.x-tw/2,t.y+d.r+4,tw,16,8);ctx.fill();
      ctx.fillStyle=d.col;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(d.label,t.x,t.y+d.r+12.5);ctx.textBaseline='alphabetic';
    }
  }

  function drawPick(p){
    var pulse=calm?0:Math.sin(p.age*5)*3;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.strokeStyle=C.lime;ctx.globalAlpha=.35;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,p.r+7+pulse,0,6.2832);ctx.stroke();
    ctx.globalAlpha=1;
    glow(C.lime,20);
    ctx.fillStyle=C.lime;
    ctx.beginPath();
    for(var k=0;k<6;k++){var a=k*Math.PI/3+(calm?0:p.age*.8);var px=Math.cos(a)*p.r,py=Math.sin(a)*p.r;if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.closePath();ctx.fill();noGlow();
    ctx.fillStyle=C.navy;
    ctx.font='700 '+(p.kind.length>3?9:10)+'px Unbounded,Manrope,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.kind,0,1);
    ctx.restore();
  }

  function drawBoss(){
    var b=boss,col=b.flash>0?'#ffffff':C.boss;
    ctx.save();ctx.translate(b.x,b.y);
    var rot=calm?0:b.age*.6;
    ctx.strokeStyle=C.boss;ctx.lineWidth=3;ctx.globalAlpha=.6;
    for(var s=0;s<6;s++){var a0=rot+s*Math.PI/3;ctx.beginPath();ctx.arc(0,0,b.r+12,a0,a0+Math.PI/5);ctx.stroke();}
    ctx.globalAlpha=1;
    glow(C.boss,30);ctx.fillStyle=col;
    ctx.beginPath();for(var k=0;k<8;k++){var a=k*Math.PI/4+Math.PI/8;var px=Math.cos(a)*b.r,py=Math.sin(a)*b.r;if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.closePath();ctx.fill();noGlow();
    ctx.strokeStyle=C.navy;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,b.r*.55,0,6.2832);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,b.r*.22,0,6.2832);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-b.r*.8,0);ctx.lineTo(-b.r*.35,0);ctx.moveTo(b.r*.35,0);ctx.lineTo(b.r*.8,0);ctx.moveTo(0,-b.r*.8);ctx.lineTo(0,-b.r*.35);ctx.moveTo(0,b.r*.35);ctx.lineTo(0,b.r*.8);ctx.stroke();
    ctx.restore();
    var bw=W-80,pct=Math.max(0,b.hp/b.max);
    ctx.fillStyle='rgba(10,18,48,.8)';rr(40,14,bw,10,5);ctx.fill();
    ctx.fillStyle=C.boss;rr(40,14,Math.max(10,bw*pct),10,5);ctx.fill();
    ctx.font='700 10px "JetBrains Mono",monospace';ctx.fillStyle=C.ink;ctx.textAlign='center';
    ctx.fillText('ЦЕЛЕВАЯ АТАКА (APT) · '+Math.ceil(b.hp)+' / '+b.max,W/2,40);
  }

  function drawCore(){
    var cx=W/2,cy=H-42;
    var g=ctx.createRadialGradient(cx,cy,4,cx,cy,80);
    var hot=breachFlash>0;
    g.addColorStop(0,hot?'rgba(255,143,12,.5)':(healFlash>0?'rgba(175,251,51,.45)':'rgba(33,118,255,.45)'));g.addColorStop(1,'rgba(33,118,255,0)');
    ctx.fillStyle=g;ctx.fillRect(cx-90,cy-90,180,180);
    ctx.strokeStyle=hot?C.orange:'rgba(33,118,255,.6)';ctx.lineWidth=2;
    var rot=calm?0:clock*.9;
    for(var s=0;s<3;s++){var a0=rot+s*Math.PI*2/3;ctx.beginPath();ctx.arc(cx,cy,36,a0,a0+Math.PI/2.4);ctx.stroke();}
    if(iconReady){
      var sc=calm?1:1+Math.sin(clock*2)*.03;
      var w=50*sc;
      ctx.drawImage(icon,cx-w/2,cy-w/2,w,w);
    }
  }

  function draw(){
    ctx.save();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=C.navy;ctx.fillRect(0,0,W,H);
    if(shake>0)ctx.translate(rand(-shake,shake)*.5,rand(-shake,shake)*.5);

    ctx.fillStyle='rgba(147,160,207,.12)';
    for(var gx=20;gx<W;gx+=40)for(var gy=20;gy<H;gy+=40)ctx.fillRect(gx-1,gy-1,2,2);
    ctx.font='500 12px "JetBrains Mono",monospace';ctx.textAlign='center';
    for(var ri=0;ri<rain.length;ri++){var rd=rain[ri];ctx.fillStyle='rgba(33,118,255,'+rd.a+')';ctx.fillText(rd.ch,rd.x,rd.y);}
    if(slowT>0&&state!=='idle'){ctx.fillStyle='rgba(34,211,238,.05)';ctx.fillRect(0,0,W,H);}

    var shieldCol=breachFlash>0?C.orange:(integrity<35?C.orange:C.blue);
    var lg=ctx.createLinearGradient(0,LINE-30,0,LINE);
    lg.addColorStop(0,'rgba(33,118,255,0)');lg.addColorStop(1,breachFlash>0?'rgba(255,143,12,.25)':'rgba(33,118,255,.14)');
    ctx.fillStyle=lg;ctx.fillRect(0,LINE-30,W,30);
    ctx.fillStyle='rgba(33,118,255,.09)';ctx.fillRect(0,LINE,W,H-LINE);
    ctx.save();
    ctx.setLineDash([8,6]);ctx.lineDashOffset=calm?0:-clock*30;
    ctx.strokeStyle=shieldCol;ctx.lineWidth=breachFlash>0?3:2;
    ctx.beginPath();ctx.moveTo(0,LINE);ctx.lineTo(W,LINE);ctx.stroke();
    ctx.restore();
    ctx.font='500 10px "JetBrains Mono",monospace';
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.fillStyle=C.muted;
    ctx.fillText('ПЕРИМЕТР',12,LINE-8);

    drawCore();

    var i;
    if(state!=='idle'){
      var segW=(W-24-(WAVES-1)*3)/WAVES;
      for(i=0;i<WAVES;i++){
        var done=endless||i<wave-1,cur=!endless&&i===wave-1;
        ctx.fillStyle=done?C.lime:(cur?'rgba(175,251,51,.35)':'rgba(34,48,106,.9)');
        ctx.fillRect(12+i*(segW+3),H-10,segW,3);
        if(cur){ctx.fillStyle=C.lime;ctx.fillRect(12+i*(segW+3),H-10,segW*Math.min(1,(elapsed-(wave-1)*WAVE_LEN)/WAVE_LEN),3);}
      }
    }

    for(i=0;i<tels.length;i++){
      var tl=tels[i];ctx.save();ctx.strokeStyle='#F8FAFC';ctx.setLineDash([4,4]);ctx.lineWidth=2;ctx.globalAlpha=.35+.4*Math.sin(clock*16);
      ctx.beginPath();ctx.arc(tl.x,tl.y,24,0,6.2832);ctx.stroke();ctx.restore();
      ctx.fillStyle='#F8FAFC';ctx.font='800 16px Manrope,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',tl.x,tl.y);ctx.textBaseline='alphabetic';
    }
    if(eff.ngfw>0){
      ctx.save();glow(C.lime,18);ctx.strokeStyle=C.lime;ctx.lineWidth=4;ctx.globalAlpha=eff.ngfw<2?(.4+.4*Math.sin(clock*20)):.9;
      ctx.beginPath();ctx.moveTo(0,LINE-4);ctx.lineTo(W,LINE-4);ctx.stroke();noGlow();ctx.restore();
    }
    if(beams.length){
      ctx.save();glow('#FF4D5E',10);ctx.strokeStyle='#FF4D5E';ctx.lineWidth=3;
      for(i=0;i<beams.length;i++){ctx.globalAlpha=beams[i].life/.15;ctx.beginPath();ctx.moveTo(W/2,H-60);ctx.lineTo(beams[i].x,beams[i].y);ctx.stroke();}
      noGlow();ctx.restore();ctx.globalAlpha=1;
    }
    if(boss)drawBoss();
    for(i=0;i<picks.length;i++)drawPick(picks[i]);
    for(i=0;i<threats.length;i++)drawThreat(threats[i]);

    for(i=0;i<waves.length;i++){
      var wv=waves[i],k=1-wv.life/.4;
      ctx.globalAlpha=1-k;ctx.strokeStyle=wv.col;ctx.lineWidth=3*(1-k)+1;
      ctx.beginPath();ctx.arc(wv.x,wv.y,wv.max*k,0,6.2832);ctx.stroke();
    }
    ctx.globalAlpha=1;
    for(i=0;i<parts.length;i++){
      var q=parts[i];
      ctx.globalAlpha=Math.max(0,q.life/q.max);
      ctx.fillStyle=q.col;ctx.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size);
    }
    ctx.globalAlpha=1;
    for(i=0;i<rings.length;i++){
      var r=rings[i];
      ctx.globalAlpha=r.life/.3;ctx.strokeStyle=C.muted;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(r.x,r.y,(1-r.life/.3)*18+4,0,6.2832);ctx.stroke();
    }
    ctx.globalAlpha=1;

    ctx.textAlign='center';
    for(i=0;i<floats.length;i++){
      var f=floats[i];
      ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.col;
      ctx.font=f.big?'700 16px Unbounded,Manrope,sans-serif':'800 16px Manrope,sans-serif';
      ctx.fillText(f.txt,Math.min(W-90,Math.max(90,f.x)),f.y);
    }
    ctx.globalAlpha=1;

    if(pamFlash>0){ctx.fillStyle='rgba(238,242,255,'+(pamFlash*.35)+')';ctx.fillRect(0,0,W,H);}
    if(integrity<35&&state==='play'&&!calm){
      var vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);
      vg.addColorStop(0,'rgba(255,143,12,0)');vg.addColorStop(1,'rgba(255,143,12,'+(.12+.08*Math.sin(clock*5))+')');
      ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    }

    if(state==='play'||state==='pause'){
      ctx.font='500 13px "JetBrains Mono",monospace';
      var ey=boss?62:24,lines=[];
      if(slowT>0)lines.push(['#22D3EE','SIEM · замедление '+slowT.toFixed(1)+' с']);
      if(eff.ngfw>0)lines.push([C.lime,'NGFW · щит '+eff.ngfw.toFixed(1)+' с']);
      if(eff.edr>0)lines.push(['#FF4D5E','EDR · зачистка '+eff.edr.toFixed(1)+' с']);
      if(eff.pam>0)lines.push(['#A78BFA','PAM · очки ×2 '+eff.pam.toFixed(1)+' с']);
      if(eff.nad>0)lines.push(['#F0ABFC','NAD · контроль '+eff.nad.toFixed(1)+' с']);
      if(bck>0)lines.push([C.lime,'Container Security · защит: '+bck]);
      ctx.textAlign='left';
      for(var li=0;li<lines.length;li++){
        var lw=ctx.measureText(lines[li][1]).width+12;
        ctx.fillStyle='rgba(10,18,48,.82)';rr(6,ey+li*21-14,lw,19,5);ctx.fill();
        ctx.fillStyle=lines[li][0];ctx.fillText(lines[li][1],12,ey+li*21);
      }
      if(combo>=5){
        var sc=1+comboPop*.6;
        ctx.save();ctx.translate(W-12,boss?60:24);ctx.scale(sc,sc);
        ctx.textAlign='right';ctx.fillStyle=comboPop>0?C.lime:C.ink;ctx.font='700 13px Unbounded,Manrope,sans-serif';
        ctx.fillText('СЕРИЯ ×'+mult(),0,0);ctx.restore();
      }
      if(banner>0){
        ctx.globalAlpha=Math.min(1,banner);
        ctx.font='700 30px Unbounded,Manrope,sans-serif';
        ctx.textAlign='center';ctx.fillStyle=wave===WAVES&&!endless?C.boss:C.ink;
        ctx.fillText(wave===WAVES&&!endless?'ФИНАЛЬНАЯ ВОЛНА':'ВОЛНА '+wave,W/2,H*.36);
        if(bannerSub){ctx.font='700 15px Manrope,sans-serif';ctx.fillStyle=C.lime;wrapText(bannerSub,W/2,H*.36+30,W-40,20);}
        ctx.globalAlpha=1;
      }
    }
    ctx.restore();
  }

  var lastScore=-1,lastWave='',lastBest=-1,lastInt=-1;
  function hud(){
    if(score!==lastScore){$('score').textContent=score;lastScore=score;}
    var wl=endless?String(wave):wave+'/'+WAVES;
    if(wl!==lastWave){$('wave').textContent=wl;lastWave=wl;}
    if(best!==lastBest){$('best').textContent=best;lastBest=best;}
    var iv=Math.round(integrity);
    if(iv!==lastInt){
      lastInt=iv;
      $('intText').textContent=iv+'%';
      var fill=$('intFill');
      fill.style.width=iv+'%';
      fill.classList.toggle('low',iv<35);
    }
  }

  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();
    var r=cv.getBoundingClientRect();
    hit((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);
  });
  $('go').addEventListener('click',reset);

  function showTab(b){
    $('tabT').setAttribute('aria-selected',b?'false':'true');
    $('tabB').setAttribute('aria-selected',b?'true':'false');
    $('threatlist').hidden=!!b;$('bonuslist').hidden=!b;
    $('sheetBody').scrollTop=0;
  }
  function openSheet(){
    if(state==='play')pauseGame();
    $('sheet').hidden=false;
    if(inTg&&tgv('6.1'))try{tg.BackButton.show();}catch(e){}
  }
  function closeSheet(){
    $('sheet').hidden=true;
    if(inTg&&tgv('6.1'))try{tg.BackButton.hide();}catch(e){}
  }
  $('infobtn').addEventListener('click',openSheet);
  $('info0').addEventListener('click',openSheet);
  $('sheetClose').addEventListener('click',closeSheet);
  $('tabT').addEventListener('click',function(){showTab(false);});
  $('tabB').addEventListener('click',function(){showTab(true);});
  if(inTg&&tgv('6.1'))try{tg.BackButton.onClick(closeSheet);}catch(e){}

  // links in the report open in the browser, not inside the mini app
  $('ov').addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]');
    if(a&&openExt(a.href))e.preventDefault();
  });

  // keep the 3:4 playfield as large as the screen allows
  function fit(){
    var h=(inTg&&tg.viewportStableHeight)||window.innerHeight;
    document.documentElement.style.setProperty('--app-h',Math.round(h)+'px');
    var st=$('stage'),fb=$('fieldbox'),r=st.getBoundingClientRect();
    if(!r.width||!r.height)return;
    var ratio=r.height/r.width,w,hh;
    if(ratio<=4/3){H=640;w=Math.floor(r.height*.75);hh=Math.floor(r.height);}
    else{H=Math.min(900,Math.round(480*ratio));w=Math.floor(r.width);hh=Math.floor(r.width*H/480);}
    LINE=H-92;
    var cw=Math.round(W*dpr),ch=Math.round(H*dpr);
    if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch;}
    fb.style.width=w+'px';fb.style.height=hh+'px';fb.style.aspectRatio='auto';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,200);});
  if(inTg){
    try{tg.onEvent('viewportChanged',function(ev){if(!ev||ev.isStateStable)fit();});}catch(e){}
    try{tg.onEvent('deactivated',function(){if(state==='play')pauseGame();});}catch(e){}
  }
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  fit();setTimeout(fit,300);
  $('pausebtn').addEventListener('click',function(){if(state==='play')pauseGame();else if(state==='pause')resumeGame();});
  document.addEventListener('keydown',function(e){
    var isP=e.key==='p'||e.key==='P'||e.key==='з'||e.key==='З';
    if(!(isP||e.key==='Escape'))return;
    if(state==='play'){pauseGame();e.preventDefault();}
    else if(state==='pause'){resumeGame();e.preventDefault();}
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play')pauseGame();});

  var last=performance.now();
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000);
    last=now;
    update(dt);draw();hud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__pd={get:function(){return{state:state,wave:wave,score:score,integrity:integrity,boss:boss?boss.hp:null,threats:threats.length};},
    threats:function(){var a=threats.map(function(t){return{x:t.x,y:t.y,k:t.kind};});if(boss)a.push({x:boss.x,y:boss.y,k:'boss'});return a;},
    picks:function(){return picks.map(function(p){return{x:p.x,y:p.y,k:p.kind};});},give:function(k){collect({kind:k,x:W/2,y:200});},stats:function(){return stats;},hit:hit,skip:function(s){elapsed+=s;}};
})();
</script>
</body>
</html>
