<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Puzzle Quest</title>
<meta name="theme-color" content="#0a1230">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Full-screen canvas platformer. Menus, pause and reports are DOM overlays on top of the canvas. */
:root{
  --bg:#0a1230;--surface:#101a40;--surface2:#16245a;--line:#22306a;--fg:#eef2ff;--muted:#93a0cf;
  --threat:#ff8f0c;--good:#affb33;--core:#2176ff;
  --font-display:"Unbounded","Arial Black",sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --st:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px));
  --sb:calc(env(safe-area-inset-bottom,0px) + var(--tg-safe-area-inset-bottom,0px));
  --sl:max(env(safe-area-inset-left,0px),var(--tg-safe-area-inset-left,0px));
  --sr:max(env(safe-area-inset-right,0px),var(--tg-safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#wrap{position:fixed;inset:0;background:#050a1c}
#cv{position:absolute;display:block;touch-action:none;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;letter-spacing:0;text-transform:uppercase;color:var(--good)}
.btn{appearance:none;border:0;cursor:pointer;background:var(--good);color:var(--bg);font-family:var(--font-display);font-weight:700;font-size:13px;line-height:1.3;letter-spacing:0;padding:12px 16px;border-radius:0;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.35),0 0 0 3px #050a1c}
.btn:active{transform:translate(2px,2px)}
.btn.ghost{background:var(--surface);color:var(--fg);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.08),0 0 0 3px #050a1c}
.btn:focus-visible,.ib:focus-visible,.lvl:focus-visible{outline:2px solid var(--good);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
.ib{position:absolute;z-index:3;width:40px;height:40px;display:grid;place-items:center;background:rgba(16,26,64,.85);border:3px solid #050a1c;border-radius:0;cursor:pointer;color:var(--fg)}
#pausebtn{top:calc(var(--st) + 10px);right:calc(var(--sr) + 10px)}
#ov{position:absolute;inset:0;z-index:5;display:flex;overflow:auto;background:rgba(5,10,28,.78);padding:calc(var(--st) + 16px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px);-webkit-overflow-scrolling:touch}
#ov.clear{background:rgba(5,10,28,.42)}
.ovc{margin:auto;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.ovc.wide{max-width:720px}
.ovc .logo{height:28px;width:auto}
.ovc h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:0;text-shadow:3px 3px 0 #050a1c}
.ovc h1 em{font-style:normal;color:var(--good)}
.ovc h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.25;text-wrap:balance;text-shadow:2px 2px 0 #050a1c}
.ovc p{margin:0;color:var(--muted);font-size:13px;text-wrap:pretty}
.ovc p b{color:var(--fg)}
.acts{display:flex;flex-direction:column;gap:8px;width:100%}
.acts.row{flex-direction:row;flex-wrap:wrap}
.acts.row .btn{flex:1 1 140px}
.small{font-size:12px!important}
.stars{font-size:28px;letter-spacing:5px;color:var(--good);line-height:1}
.stars i{font-style:normal;color:var(--line)}
.rep{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin:0;width:100%;font-size:13px;text-align:left}
.rep dt{color:var(--muted)}
.rep dd{margin:0;font-family:var(--font-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.recs{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.rec{border-left:6px solid var(--pc);background:var(--surface);padding:10px 12px;border-radius:0;font-size:13px;color:var(--muted);line-height:1.45}
.rec b{color:var(--fg)}
.rec .pz{display:block;margin-top:6px;color:var(--fg)}
.site{color:var(--good);font-weight:700}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.diff button{appearance:none;cursor:pointer;text-align:left;background:var(--surface);border:3px solid var(--line);border-radius:0;padding:12px;display:flex;flex-direction:column;gap:4px;color:var(--fg)}
.diff button b{font-family:var(--font-display);font-weight:700;font-size:14px}
.diff button span{font-size:12px;color:var(--muted);line-height:1.35}
.diff button:hover{border-color:var(--good)}
.map{width:100%;display:flex;flex-direction:column;gap:10px}
.world{background:var(--surface);border:3px solid var(--line);border-radius:0;padding:12px;text-align:left}
.world.off{opacity:.45}
.world .wh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.world .wh b{font-family:var(--font-display);font-weight:700;font-size:13px;line-height:1.3}
.world .wh span{font-size:11px;color:var(--muted)}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lvl{appearance:none;cursor:pointer;background:var(--surface2);border:3px solid var(--line);border-radius:0;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg);min-height:72px}
.lvl b{font-family:var(--font-display);font-weight:700;font-size:15px}
.lvl small{font-size:10px;color:var(--muted);line-height:1.2;text-align:center}
.lvl i{font-style:normal;font-size:12px;letter-spacing:2px;color:var(--good)}
.lvl i u{text-decoration:none;color:var(--line)}
.lvl.done{border-color:rgba(175,251,51,.5)}
.lvl.next{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.lvl[disabled]{opacity:.4;cursor:default}
.pieces{display:flex;gap:6px;justify-content:center}
.pieces span{width:26px;height:26px;border-radius:0;border:2px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.pieces span.on{border:1px solid var(--good);background:#eef2ff}
.cards{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.card{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--pc);border-radius:0;padding:9px 11px}
.card .nm{font-weight:800;font-size:13px}
.card .ds{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.card .gm{font-size:12px;color:var(--good);line-height:1.4;margin-top:4px}
.card.off{opacity:.45}
.tabs{display:flex;gap:6px;width:100%}
.tabs button{flex:1;appearance:none;cursor:pointer;background:transparent;border:3px solid var(--line);border-radius:0;padding:8px;color:var(--muted);font-family:var(--font-display);font-weight:700;font-size:12px}
.tabs button[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;text-align:left;width:100%}
.keys kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap;justify-self:start}
.keys span{color:var(--muted)}
.skip{position:absolute;z-index:4;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 14px);appearance:none;cursor:pointer;background:rgba(16,26,64,.9);border:3px solid #050a1c;border-radius:0;padding:9px 12px;color:var(--fg);font-family:var(--font-display);font-weight:700;font-size:12px}
#rot{position:absolute;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#rot svg{animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
#rot b{font-family:var(--font-display);font-weight:700;font-size:18px}
#rot p{margin:0;color:var(--muted);font-size:13px;max-width:280px}
.home{color:var(--muted);font-size:12px;text-decoration:none;border-bottom:1px dashed var(--line)}
@media (prefers-reduced-motion:reduce){#rot svg{animation:none}}
@media (max-height:500px){.ovc{gap:9px}.ovc h1{font-size:24px}.ovc h2{font-size:17px}.btn{padding:10px 14px;font-size:12px}}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="cv" aria-label="Игровое поле Puzzle Quest"></canvas>
  <button class="ib" id="pausebtn" type="button" aria-label="Пауза" hidden><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
  <div id="ov" hidden><div class="ovc" id="ovc"></div></div>
  <div id="rot" hidden>
    <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><rect x="22" y="8" width="28" height="56" rx="5" fill="none" stroke="#affb33" stroke-width="3"/><circle cx="36" cy="57" r="2.5" fill="#affb33"/></svg>
    <b>Поверните телефон</b>
    <p>Puzzle Quest играется горизонтально — как на настоящей приставке.</p>
  </div>
</div>

function drawTile(code,tx,ty,th,L,t){
  var x=tx*TS,y=ty*TS;
  var above=L.tile(tx,ty-1),openTop=!isSolidCode(above)&&above!==2;
  if(code===1||code===8){
    ctx.fillStyle=th.floorBody;ctx.fillRect(x,y,TS+.5,TS+.5);
    ctx.fillStyle=th.floorLine;ctx.fillRect(x,y+TS-2,TS+.5,2);
    if(hash(tx*31+ty*7)<.3){ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(x+4,y+8,TS-8,TS-16);}
    if(openTop){ctx.fillStyle=th.floorTop;ctx.fillRect(x,y,TS+.5,7);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x,y,TS+.5,1.5);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x,y+7,TS+.5,1.5);}
    if(!isSolidCode(L.tile(tx-1,ty))){ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(x,y,2,TS);}
    if(!isSolidCode(L.tile(tx+1,ty))){ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x+TS-2,y,2,TS);}
  }else if(code===9){drawSpring(tx,ty,th,L);
  }else if(code>=10&&code<=13){drawTile3(code,tx,ty,th,L);
  }else if(code===2&&th.kind){
    var l2=L.tile(tx-1,ty)!==2,r2=L.tile(tx+1,ty)!==2;
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x+(l2?3:0),y+7,TS-(l2?3:0)-(r2?3:0)+.5,4);
    ctx.fillStyle=th.desk;rr(x-(l2?1:0),y,TS+(l2?1:0)+(r2?1:0)+.5,8,l2||r2?4:0);ctx.fill();ctx.fillStyle=th.floorTop;ctx.fillRect(x,y,TS+.5,2);
    if(l2){ctx.fillStyle=th.deskDark;circ(x+5,y+4,1.6);ctx.fill();}
  }else if(code===2){
    var l=L.tile(tx-1,ty)!==2,r=L.tile(tx+1,ty)!==2;
    ctx.fillStyle=th.desk;rr(x-(l?1:0),y,TS+(l?1:0)+(r?1:0)+.5,7,l||r?2:0);ctx.fill();
    ctx.fillStyle=th.deskDark;ctx.fillRect(x,y+5,TS+.5,2);
    if(l){ctx.fillStyle=th.deskDark;ctx.fillRect(x+3,y+7,3,L.legLen(tx,ty));}
    if(r){ctx.fillStyle=th.deskDark;ctx.fillRect(x+TS-6,y+7,3,L.legLen(tx,ty));}
    var hsh=hash(tx*13+ty*101);
    if(hsh<.22){ // monitor
      ctx.fillStyle='#2b3354';ctx.fillRect(x+14,y-4,4,4);ctx.fillStyle='#1c2240';rr(x+6,y-18,20,14,2);ctx.fill();ctx.fillStyle=L.dark?'#1d3a6a':'#4d8cff';rr(x+8,y-16,16,10,1);ctx.fill();
    }else if(hsh<.34){ // plant
      ctx.fillStyle='#c7744a';ctx.fillRect(x+12,y-7,8,7);ctx.fillStyle='#3fae5a';circ(x+16,y-11,5);ctx.fill();circ(x+12,y-13,3.6);ctx.fill();circ(x+20,y-13,3.6);ctx.fill();
    }
  }else if(code===3||code===4){
    var bump=L.bumpAt&&L.bumpAt[tx+','+ty]||0;var by=y-Math.sin(bump*Math.PI)*6;
    ctx.fillStyle=code===3?'#2c3d8f':'#1d2650';rr(x+1,by+1,TS-2,TS-2,4);ctx.fill();
    ctx.strokeStyle=code===3?'#4f68d6':'#2a3570';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=code===3?'#24337a':'#18204a';rr(x+4,by+5,TS-8,6,1.5);ctx.fill();rr(x+4,by+14,TS-8,6,1.5);ctx.fill();
    if(code===3){var on=Math.floor(t*4+tx)%2;ctx.fillStyle=on?C.lime:'#5f8f1c';circ(x+TS-8,by+8,1.6);ctx.fill();ctx.fillStyle=on?'#5f8f1c':C.lime;circ(x+TS-8,by+17,1.6);ctx.fill();
      ctx.fillStyle='#eef2ff';rr(x+5,by+21,8,8,1.6);ctx.fill();drawMark(x+9,by+25,6.4);}
  }else if(code===5){
    ctx.fillStyle=th.floorBody;ctx.fillRect(x,y,TS+.5,TS*.55);
    ctx.fillStyle=th.floorTop;ctx.fillRect(x,y,TS+.5,7);
    var sh=L.crackShake&&L.crackShake[tx]||0;
    ctx.strokeStyle='rgba(255,77,94,'+(.6+.4*Math.sin(t*6+tx))+')';ctx.lineWidth=1.6;ctx.beginPath();
    var h0=hash(tx*7);ctx.moveTo(x+4,y+1);ctx.lineTo(x+10+h0*6,y+8);ctx.lineTo(x+8,y+15);ctx.moveTo(x+10+h0*6,y+8);ctx.lineTo(x+22,y+6);ctx.lineTo(x+28,y+14);ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.moveTo(x,y+TS*.55);for(var k=0;k<=4;k++)ctx.lineTo(x+k*TS/4,y+TS*.55+(k%2?6:0));ctx.lineTo(x+TS,y+TS*.55);ctx.fill();
  }else if(code===6){
    ctx.fillStyle=th.floorBody;ctx.fillRect(x,y,TS+.5,TS+.5);ctx.fillStyle=th.floorTop;ctx.fillRect(x,y,TS+.5,7);
    ctx.fillStyle='rgba(175,251,51,.85)';rr(x+3,y+1.5,TS-6,4,1.5);ctx.fill();
    ctx.fillStyle='#0a1230';circ(x+6,y+3.5,1);ctx.fill();circ(x+TS-6,y+3.5,1);ctx.fill();

    ctx.fillStyle='#1f4fd6';ctx.fillRect(x+2,y,TS-4,TS+.5);ctx.fillStyle='#173da8';ctx.fillRect(x+TS/2-1,y,2,TS);
    if(top){ctx.fillStyle='#0a1230';rr(x+5,y+6,TS-10,13,2);ctx.fill();ctx.fillStyle=C.cred;ctx.font='800 8px Manrope,Arial';ctx.textAlign='center';ctx.fillText('IDM',x+TS/2,y+15.5);}
    else{ctx.strokeStyle='#e8ecff';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x+TS/2,y+10,3.6,Math.PI,0);ctx.stroke();ctx.fillStyle='#e8ecff';rr(x+TS/2-5,y+10,10,8,1.5);ctx.fill();}
  }
}
// ---------- backgrounds ----------
function drawBackground(L,cx,cy,t){
  if(L.th.kind==='web'){drawWebBackground(L,cx,cy,t);return;}
  if(L.th.kind&&L.th.kind!=='office'){drawBg3(L,cx,cy,t);return;}
  var th=L.th,W=VW,H=VIEW_H;
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,th.wallTop);g.addColorStop(1,th.wallBot);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // far: windows with skyline (parallax .25)
  var px=cx*.25,ww=150,wy=40-cy*.2;
  var i0=Math.floor(px/ww)-1,i1=Math.ceil((px+W)/ww)+1;
  for(var i=i0;i<=i1;i++){
    var x=i*ww-px+14;
    var sg=ctx.createLinearGradient(0,wy,0,wy+150);sg.addColorStop(0,th.win1);sg.addColorStop(1,th.win2);ctx.fillStyle=sg;rr(x,wy,ww-28,150,6);ctx.fill();
    ctx.save();rr(x,wy,ww-28,150,6);ctx.clip();
    if(!th.sky){ctx.fillStyle='rgba(255,255,255,.7)';for(var s=0;s<6;s++){circ(x+hash(i*17+s)*120,wy+hash(i*29+s)*80,hash(s+i)*1.2+.4);ctx.fill();}
      if(((i%5)+5)%5===2){ctx.fillStyle='#e9ecff';circ(x+70,wy+34,13);ctx.fill();ctx.fillStyle=th.win1;circ(x+76,wy+30,11);ctx.fill();}}
    for(var b=0;b<6;b++){var bh=40+hash(i*11+b)*80,bw=16+hash(i*5+b)*12,bx=x+b*22-4;
      ctx.fillStyle=th.sky?'rgba(20,40,110,.55)':'rgba(10,16,48,.95)';ctx.fillRect(bx,wy+150-bh,bw,bh);
      ctx.fillStyle=th.sky?'rgba(255,255,255,.18)':'rgba(255,212,59,.55)';
      for(var wy2=wy+150-bh+6;wy2<wy+146;wy2+=9)for(var wx=bx+3;wx<bx+bw-3;wx+=6)if(hash(wx*3+wy2*7+i)<(th.sky?.5:.25))ctx.fillRect(wx,wy2,2.4,3.4);}
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=3;rr(x,wy,ww-28,150,6);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x+(ww-28)/2-1.5,wy,3,150);
  }
  // mid: office props (parallax .55)
  var mx=cx*.55,mw=260,my=VIEW_H-cy*.55;
  var j0=Math.floor(mx/mw)-1,j1=Math.ceil((mx+W)/mw)+1;
  for(var j=j0;j<=j1;j++){
    var x2=j*mw-mx,h=hash(j*97+L.seed),base=my-150;
    ctx.globalAlpha=L.dark?.35:.6;
    if(h<.3){ // poster with puzzle logo
      ctx.globalAlpha=L.dark?.5:1;ctx.fillStyle='#d6dbe8';rr(x2+40,base-30,56,72,4);ctx.fill();drawMark(x2+68,base,30);
      ctx.fillStyle='rgba(34,48,122,.6)';ctx.fillRect(x2+50,base+28,36,3);ctx.fillRect(x2+56,base+34,24,2);
    }else if(h<.55){ // big plant
      ctx.fillStyle='#8c4f32';ctx.fillRect(x2+60,base+70,26,30);ctx.fillStyle='#2f8a4c';for(var q=0;q<6;q++){ctx.beginPath();ctx.ellipse(x2+73+Math.cos(q)*12,base+50-q*6,6,16,Math.cos(q)*.8,0,Math.PI*2);ctx.fill();}
    }else if(h<.75){ // clock
      ctx.fillStyle='#e8ecff';circ(x2+90,base-10,15);ctx.fill();ctx.strokeStyle='#22307a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x2+90,base-10);ctx.lineTo(x2+90,base-21);ctx.moveTo(x2+90,base-10);ctx.lineTo(x2+98,base-6);ctx.stroke();
    }else{ // server rack in background
      ctx.fillStyle='#141f52';rr(x2+50,base+10,40,90,3);ctx.fill();for(var r=0;r<7;r++){ctx.fillStyle='#1d2a6a';ctx.fillRect(x2+54,base+16+r*12,32,8);ctx.fillStyle=(Math.floor(t*3+r+j)%3)?C.lime:C.cyan;ctx.fillRect(x2+80,base+19+r*12,3,2);}
    }
    ctx.globalAlpha=1;

var MAP_H=13,GROUND=11;
function isSolidCode(c){return c===1||c===3||c===4||c===5||c===6||c===7||c===8||c===9||c===11||c===12||c===13;}
function LB(w){this.w=w;this.h=MAP_H;this.t=new Uint8Array(w*MAP_H);this.ents=[];this.blocks={};}
LB.prototype={
  set:function(x,y,c){if(x>=0&&x<this.w&&y>=0&&y<this.h)this.t[y*this.w+x]=c;return this;},
  solid:function(x0,x1,y0,y1,c){for(var x=x0;x<=x1;x++)for(var y=y0;y<=y1;y++)this.set(x,y,c||1);return this;},
  ground:function(x0,x1,top){return this.solid(x0,x1,top==null?GROUND:top,MAP_H-1);},
  plat:function(x0,x1,y){for(var x=x0;x<=x1;x++)this.set(x,y,2);return this;},
  blk:function(x,y,k){this.set(x,y,3);this.blocks[x+','+y]=k;return this;},
  crack:function(x0,x1,y){for(var x=x0;x<=x1;x++){this.set(x,y,5);for(var yy=y+1;yy<MAP_H;yy++)this.set(x,yy,0);}return this;},
  door:function(x,y0,y1){for(var y=y0;y<=y1;y++)this.set(x,y,7);return this;},
  e:function(type,x,y,o){var d={type:type,tx:x,ty:y};if(o)for(var k in o)d[k]=o[k];this.ents.push(d);return this;},
  frags:function(x0,x1,y){for(var x=x0;x<=x1;x++)this.e('frag',x,y);return this;},
  arc:function(x0,x1,y,hgt){var n=x1-x0;for(var x=x0;x<=x1;x++){var k=(x-x0)/n;this.e('frag',x,y-Math.round(Math.sin(k*Math.PI)*(hgt||2)));}return this;}
};

// ---------- procedural level builder (keeps every jump within reach) ----------
function rngOf(seed){var s=seed>>>0||1;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function genLevel(id,cfg){
  var L=new LB(cfg.w),r=rngOf(cfg.seed||id.charCodeAt(0)*977+id.charCodeAt(2)*131);
  function ri(a,b){return a+Math.floor(r()*(b-a+1));}
  function pick(a){return a[Math.floor(r()*a.length)];}
  L.name=cfg.name;L.theme=cfg.theme;L.song=cfg.song;if(cfg.dark)L.dark=true;if(cfg.auto)L.auto=cfg.auto;
  // intro: start, signs and the new solutions
  L.ground(0,17).e('start',2,10);
  (cfg.signs||[]).forEach(function(s,i){L.e('sign',4+i*5,10,{txt:s});});
  (cfg.intro||[]).forEach(function(k,i){L.blk(7+i*4,7,k);});
  L.frags(11,15,10);
  var x=18,lastPit=false,cps=0,diskDone=false,foeI=0,w=cfg.w,endX=w-14;
  function foeAt(fx,l,rr){
    var f=cfg.foes[foeI++%cfg.foes.length];
    if(f.sol&&r()<(f.blkP==null?.85:f.blkP))L.blk(Math.max(l,fx-5),7,f.sol);
    var t=f.t;
    if(t==='scanner')L.e('scanner',fx,6,{l:l,r:rr});
    else if(t==='drip')L.e('drip',fx,1);
    else if(t==='phisher')L.e('phisher',fx,10,{l:l,r:rr});
    else if(t==='swarm')L.e('swarm',fx,6,{n:4});
    else L.e(t,fx,10,{l:l,r:rr});
  }
  while(x<endX){
    var seg=pick(cfg.segs);
    if((seg==='gap'||seg==='mplat')&&lastPit)seg='flat';
    if(x>endX-14&&(seg==='mplat'||seg==='cracks'))seg='flat';
    var start=x;
    if(seg==='flat'){var n=ri(10,13);L.ground(x,x+n-1);L.frags(x+1,x+3,10);if(r()<.8)foeAt(x+8,x+5,x+n-1);else if(r()<.4)L.e('coffee',x+6,10);x+=n;lastPit=false;}
    else if(seg==='gap'){var g=ri(2,3);L.arc(x-1,x+g,9,2);x+=g;lastPit=true;}
    else if(seg==='steps'){L.ground(x,x+9).solid(x+2,x+4,9,10).solid(x+5,x+6,7,10).frags(x+5,x+6,6).frags(x+2,x+4,8);x+=10;lastPit=false;}
    else if(seg==='plats'){L.ground(x,x+12).plat(x+1,x+4,8).plat(x+6,x+9,6).frags(x+1,x+4,7).frags(x+6,x+9,5);if(r()<.6)foeAt(x+11,x+9,x+12);x+=13;lastPit=false;}
    else if(seg==='mplat'){L.e('mplat',x,10,{w:2,x2:x+3,spd:55+ri(0,15)}).frags(x+1,x+4,7);x+=6;lastPit=true;}
    else if(seg==='spring'){L.ground(x,x+10).set(x+2,GROUND,9).plat(x+3,x+7,5).frags(x+3,x+7,4);if(!diskDone&&x>w*.4){L.e('disk',x+7,4);diskDone=true;}x+=11;lastPit=false;}
    else if(seg==='cracks'){L.ground(x,x+2).e('audit',x+1,10,{to:x+10}).crack(x+3,x+8,GROUND).frags(x+3,x+8,9).ground(x+9,x+11);x+=12;lastPit=false;}
    else if(seg==='hidden'){L.ground(x,x+12).frags(x+1,x+3,10);for(var hx=x+3;hx<=x+8;hx++)L.set(hx,7,10);L.frags(x+3,x+8,6);if(!diskDone&&x>w*.35){L.e('disk',x+8,6);diskDone=true;}if(r()<.6)foeAt(x+11,x+9,x+12);x+=13;lastPit=false;}
    else if(seg==='lift'){L.ground(x,x+11).e('vplat',x+2,10,{w:2,y2:4,spd:50}).plat(x+4,x+9,3).frags(x+5,x+8,2);if(!diskDone&&x>w*.3){L.e('disk',x+9,2);diskDone=true;}x+=12;lastPit=false;}
    else if(seg==='crates'){L.ground(x,x+12).solid(x+3,x+3,10,10,13).solid(x+9,x+9,10,10,13).frags(x+3,x+3,9).frags(x+9,x+9,9).e('mimic',x+6,10);x+=13;lastPit=false;}
    else if(seg==='drips'){L.ground(x,x+12).frags(x+2,x+10,10).e('drip',x+5,1).e('drip',x+9,1);x+=13;lastPit=false;}
    // checkpoints at roughly 1/3 and 2/3
    if(!lastPit&&cps<2&&start>w*(cps+1)/3){L.e('cp',start+1,10);cps++;}
  }
  if(!diskDone){L.plat(endX-8,endX-5,8).e('disk',endX-6,7);}
  L.ground(x,w-1).frags(x+1,x+5,10).e('exit',w-6,10);
  return L;
}

var tempTiles={};

function clearTemp(tx,ty){var k=tx+','+ty;if(tempTiles[k]){LV.setT(tx,ty,0);delete tempTiles[k];for(var i=0;i<6;i++)fx.push({type:'spark',x:tx*TS+16,y:ty*TS+16,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,t:.4,col:'#b197fc'});}}
function updateTemp(dt){for(var k in tempTiles){var o=tempTiles[k];o.t-=dt;if(o.t<=0){var p=k.split(',');clearTemp(+p[0],+p[1]);}}}

  var tx=Math.floor((P.x+P.w/2)/TS)+P.face*2,ty=Math.floor((P.y+P.h-2)/TS);

}

  else if(e.state==='alarm'){e.timer-=dt;if(e.timer<=0){var sx=e.x+e.w/2,sy=e.y+e.h,tx=P.x+P.w/2,ty=P.y+P.h/2,d=Math.hypot(tx-sx,ty-sy)||1;

function standSpots(cx,r){var out=[];var c0=Math.floor(cx/TS);for(var x=c0-r;x<=c0+r;x++){if(Math.abs(x-c0)<2)continue;for(var y=2;y<LV.h-1;y++){var b=LV.tile(x,y+1),c=LV.tile(x,y),u=LV.tile(x,y-1);if(!isSolidCode(c)&&!isSolidCode(u)&&(isSolidCode(b)||b===2)&&c!==9){out.push({x:x,y:y});break;}}}return out;}

var fws=[];
function placeFirewall(){
  var tx=Math.floor((P.x+P.w/2+P.face*34)/TS),gy=null;
  for(var y=Math.floor((P.y+P.h-4)/TS);y<LV.h;y++){if(isSolidCode(LV.tile(tx,y))||LV.tile(tx,y)===2){gy=y;break;}}
  if(gy==null)gy=Math.floor((P.y+P.h)/TS)+1;
  var w={type:'fw',x:tx*TS+4,y:gy*TS-84,w:24,h:84,t:6,dx:0,dy:0,alive:true};fws.push(w);ents.push(w);
  sfx('boss');shake=3;

  ents.forEach(function(e){if(!e.alive||!isFoe(e))return;var ex=e.x+e.w/2-(P.x+P.w/2),ey=e.y+e.h/2-(P.y+P.h/2);

function updateFirewalls(dt){for(var i=fws.length-1;i>=0;i--){var w=fws[i];w.t-=dt;if(w.t<=0){w.alive=false;fws.splice(i,1);}}}

function updateAura(dt){
  if(P.pamT>0){P.pamT-=dt;
    ents.forEach(function(e){if(!e.alive||!isFoe(e)||P.pamHit[e.id])return;if(overlap({x:P.x-6,y:P.y-6,w:P.w+12,h:P.h+12},e)){
      if(e.type==='boss'){if(e.vuln==='pam')bossHit(e,'pam');else if(gt-(e.missT||0)>1){e.missT=gt;addFx(e.x+e.w/2,e.y-10,'Не действует! Нужен '+SOL[e.vuln].abbr,C.gold);}return;}
      P.pamHit[e.id]=1;solEffect(e,'pam');}});

    var x0=Math.floor((P.x-4)/TS),x1=Math.floor((P.x+P.w+4)/TS),y0=Math.floor(P.y/TS),y1=Math.floor((P.y+P.h)/TS);

function updatePlayer(dt){

  if(P.plat){P.x+=P.plat.dx;P.y+=P.plat.dy;
    if(!(P.x+P.w>P.plat.x&&P.x<P.plat.x+P.plat.w&&Math.abs(P.y+P.h-P.plat.y)<3)){P.plat=null;}}

  else if(P.ground){var s=Math.sign(P.vx);P.vx-=s*FRIC*dt;if(Math.sign(P.vx)!==s)P.vx=0;}

  }

function auditActivate(a){
  a.on=true;var to=a.d.to||Math.floor(a.x/TS)+20,n=0;
  for(var x=Math.floor(a.x/TS);x<=to;x++)for(var y=0;y<LV.h;y++)if(LV.tile(x,y)===5){LV.setT(x,y,6);n++;delete LV.crackTimers[x];
    fx.push({type:'ring',x:x*TS+16,y:y*TS+4,r:2,t:.6,col:C.lime});}
  sfx('audit');haptic('ok');toast('Аудит ИБ: уязвимости закрыты ('+n+')','#affb33');
  RUN.neut.vuln=(RUN.neut.vuln||0)+1;
}

// ---------- enemies ----------
function nearView(e,m){return e.x+e.w>cam.x-m&&e.x<cam.x+VW+m&&e.y+e.h>cam.y-m*2&&e.y<cam.y+VIEW_H+m;}
function enemyGround(e,dt){
  e.vy=Math.min((e.vy||0)+GRAV*dt,900);
  var r=moveBody(e,dt,true);
  e.ground=r.ground||(e.vy>=0&&onGroundCheck(e));
  if(e.y>LV.h*TS+40)e.alive=false;
  return r;
}
function ledgeAhead(e){var fx=e.dir>0?e.x+e.w+2:e.x-2,fy=e.y+e.h+4;var c=LV.tile(Math.floor(fx/TS),Math.floor(fy/TS));return !(isSolidCode(c)||isOneway(c));}
function wallAhead(e){var fx=e.dir>0?e.x+e.w+2:e.x-2;return solidAt(fx,e.y+e.h-6)||inFirewall(fx,e.y+e.h-6);}
function lineClear(y,xa,xb){var ty=Math.floor(y/TS);for(var tx=Math.floor(Math.min(xa,xb)/TS);tx<=Math.floor(Math.max(xa,xb)/TS);tx++)if(isSolidCode(LV.tile(tx,ty)))return false;return true;}
function updatePhisher(e,dt){
  if(!nearView(e,120)){return;}
  if(e.stun>0){e.stun-=dt;e.vx=0;enemyGround(e,dt);e.state='walk';e.hookOut=false;return;}
  var px=P.x+P.w/2,ex=e.x+e.w/2,dx=px-ex,dy=(P.y+P.h)-(e.y+e.h);
  e.cd-=dt;
  if(e.state==='walk'){
    e.vx=e.dir*38;
    if(e.ground&&(wallAhead(e)||ledgeAhead(e)||(e.dir>0&&e.x+e.w>=e.r)||(e.dir<0&&e.x<=e.l)))e.dir*=-1;
    if(e.cd<=0&&!P.dead&&Math.abs(dx)<230&&Math.abs(dy)<80&&Math.abs(dx)>18){e.dir=dx>0?1:-1;e.state='cast';e.timer=.55;e.vx=0;}
  }else if(e.state==='cast'){
    e.vx=0;e.timer-=dt;
    if(e.timer<=0){
      var sx=ex+e.dir*16,sy=e.y+4,tx=P.x+P.w/2,ty=P.y+P.h/2,d=Math.hypot(tx-sx,ty-sy)||1;
      hooks.push({x:sx,y:sy,ox:sx,oy:sy,vx:(tx-sx)/d*320,vy:(ty-sy)/d*320,dist:0,max:250,back:false,owner:e,k:'cred'});
      e.hookOut=true;e.state='wait';e.cd=2.6;
    }
  }else if(e.state==='wait'){e.vx=0;if(!e.hookOut)e.state='walk';}
  enemyGround(e,dt);
}
function updateRam(e,dt){
  if(!nearView(e,140))return;
  if(e.stun>0){e.stun-=dt;e.vx=0;enemyGround(e,dt);e.state='idle';e.cd=.8;return;}
  var px=P.x+P.w/2,ex=e.x+e.w/2,dx=px-ex,dy=(P.y+P.h)-(e.y+e.h);
  e.cd-=dt;
  if(e.state==='idle'){
    e.vx=Math.sin(gt*1.3+e.id)*14;if(e.vx)e.dir=e.vx>0?1:-1;
    if(e.ground&&(ledgeAhead(e)||wallAhead(e)))e.vx=0;
    if(e.cd<=0&&!P.dead&&Math.abs(dy)<40&&Math.abs(dx)<260&&Math.abs(dx)>10&&lineClear(e.y+e.h-8,ex,px)){e.dir=dx>0?1:-1;e.state='wind';e.timer=.7;e.vx=0;}
  }else if(e.state==='wind'){e.vx=0;e.timer-=dt;if(e.timer<=0){e.state='charge';e.run=0;}}
  else if(e.state==='charge'){
    e.vx=e.dir*280;e.run+=280*dt;
    if(e.ground&&ledgeAhead(e)){e.vx=0;e.state='idle';e.cd=1.2;}
    else if(e.run>440){e.state='idle';e.cd=1.2;e.vx=0;}
  }else if(e.state==='dizzy'){e.vx=0;e.timer-=dt;if(e.timer<=0){e.state='idle';e.cd=1;}}
  var r=enemyGround(e,dt);
  if(e.state==='charge'&&r.hx){e.state='dizzy';e.timer=1.4;shake=4;sfx('stomp');addFx(e.x+e.w/2,e.y,'Бум!',C.brute);}
}
function updatePlats(dt){
  ents.forEach(function(m){
    if(m.type==='mplat'){var ox=m.x;m.x+=m.dir*m.spd*dt;if(m.x>m.x1){m.x=m.x1;m.dir=-1;}if(m.x<m.x0){m.x=m.x0;m.dir=1;}m.dx=m.x-ox;m.dy=0;}
    else if(m.type==='vplat'){var oy=m.y;m.y+=m.dir*m.spd*dt;if(m.y<m.y1){m.y=m.y1;m.dir=1;}if(m.y>m.y0){m.y=m.y0;m.dir=-1;}m.dy=m.y-oy;m.dx=0;}
  });
}
function neutralize(e){
  e.alive=false;RUN.neut[e.th]=(RUN.neut[e.th]||0)+1;sfx('kill');haptic('ok');
  addFx(e.x+e.w/2,e.y-4,'Обезврежено',e.th==='cred'?C.cred:'#ff7a8a');
  for(var i=0;i<10;i++)fx.push({type:'spark',x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()-.5)*220,vy:(Math.random()-.8)*220,t:.6,col:e.th==='cred'?C.cred:C.brute});
  score(50);
}
function stunEnemy(e,s){e.stun=s;e.state=e.type==='ram'||e.type==='injector'?'idle':'walk';e.hookOut=false;hooks.forEach(function(h){if(h.owner===e)h.dead=true;});}
var SCORE=0;function score(n){SCORE+=n;}
function enemyContacts(){
  if(P.dead)return;
  for(var i=0;i<ents.length;i++){var e=ents[i];if(!e.alive)continue;
    if(!isFoe(e)||e.hidden&&e.type!=='boss'||e.type==='drip')continue;
    if(e.type==='boss'&&(e.dead||e.state==='intro'))continue;
    var box={x:e.x+3,y:e.y+4,w:e.w-6,h:e.h-4};
    if(!overlap(P,box))continue;
    var stomp=P.vy>60&&(P.y+P.h)-P.vy*(1/120)-4<=e.y+8;
    if(e.type==='mimic'&&e.state==='sleep'&&e.stun<=0){if(stomp){P.vy=-360;P.y=e.y-P.h-1;if(holds('cs')){stunEnemy(e,3);sfx('stomp');}else hurt('container',e);}continue;}
    if(stomp){
      P.vy=IN.j?-470:-330;P.y=e.y-P.h-1;P.squash=-.4;
      if(e.type==='boss'){sfx('block');if(gt-(e.stompHint||0)>4){e.stompHint=gt;toast(e.name+' неуязвим к прыжкам — нужен '+SOL[e.vuln].abbr,solColor(e.vuln));}continue;}
      if(e.stun<=0)score(10);
      stunEnemy(e,e.type==='ram'?2.8:3.2);sfx('stomp');haptic('light');addFx(e.x+e.w/2,e.y,'Оглушён',C.gold);
      if(e.state==='charge'){e.state='idle';}
      continue;
    }
    if(e.stun>0||e.state==='dizzy')continue;
    hurt(e.type==='boss'?(e.kind==='colossus'?'ddos':e.kind==='g'?(e.th==='vuln'?'vuln':e.th):'cred'):e.th,e);if(e.type==='bot'){e.vx=(e.x>P.x?1:-1)*200;e.vy=-100;}
  }
}
function updateHooks(dt){
  for(var i=hooks.length-1;i>=0;i--){var h=hooks[i];
    if(h.dead||(h.owner&&(!h.owner.alive||h.owner.stun>0))){if(h.owner)h.owner.hookOut=false;hooks.splice(i,1);continue;}
    if(!h.back){h.x+=h.vx*dt;h.y+=h.vy*dt;h.dist+=Math.hypot(h.vx,h.vy)*dt;
      if(h.dist>h.max||solidAt(h.x,h.y))h.back=true;
      if(!P.dead&&h.x>P.x-2&&h.x<P.x+P.w+2&&h.y>P.y-2&&h.y<P.y+P.h+2){
        h.back=true;
        if(P.sol&&P.sol.k==='idm'||(P.res&&P.res.k==='idm'&&false)){addFx(P.x+P.w/2,P.y-8,'Доступ запрещён',C.cred);sfx('block');}
        else if(godMode){}
        else if(P.sol){var k=P.sol.k;dropSol();RUN.dmg.cred=(RUN.dmg.cred||0)+1;sfx('steal');haptic('hit');toast('Фишер украл решение '+SOL[k].abbr+'!',C.cred);addFx(P.x+P.w/2,P.y-8,'−'+SOL[k].abbr,C.cred);h.loot=k;}
        else hurt('cred',h.owner);
      }
    }else{
      var ox=h.ox,oy=h.oy;if(h.owner&&h.owner.alive){ox=h.owner.x+h.owner.w/2+h.owner.dir*16;oy=h.owner.y+4;if(h.owner.type==='boss'){ox=h.owner.x+h.owner.w/2+h.owner.dir*40;oy=h.owner.y+20;}}
      var dx=ox-h.x,dy=oy-h.y,d=Math.hypot(dx,dy);
      if(d<12){if(h.owner)h.owner.hookOut=false;hooks.splice(i,1);continue;}
      h.x+=dx/d*420*dt;h.y+=dy/d*420*dt;
    }
  }
}
function updateShots(dt){
  for(var i=shots.length-1;i>=0;i--){var s=shots[i];s.x+=s.vx*dt;s.life-=dt;
    var stx=Math.floor(s.x/TS),sty=Math.floor(s.y/TS);if(s.k==='edr'&&LV.tile(stx,sty)===11){clearTemp(stx,sty);sfx('door');addFx(s.x,s.y,'Замок снят','#ffd8a8');}
    var dead=s.life<=0||solidAt(s.x,s.y)||inFirewall(s.x,s.y);
    for(var j=0;j<ents.length&&!dead;j++){var e=ents[j];if(!e.alive||s.hit[e.id])continue;
      if(!isFoe(e)||e.hidden)continue;
      if(s.x>e.x-4&&s.x<e.x+e.w+4&&s.y>e.y-4&&s.y<e.y+e.h+4){
        s.hit[e.id]=1;solEffect(e,s.k||'idm');dead=true;
      }}
    // break hooks
    hooks.forEach(function(h){if(Math.abs(h.x-s.x)<12&&Math.abs(h.y-s.y)<14)h.back=true;});
    if(dead){for(var k=0;k<5;k++)fx.push({type:'spark',x:s.x,y:s.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,t:.35,col:C.cred});shots.splice(i,1);}
  }
  for(i=pulses.length-1;i>=0;i--){var p=pulses[i];p.t+=dt;p.r=10+(p.max-10)*Math.min(1,p.t/.35);p.x=P.x+P.w/2;p.y=P.y+P.h/2;
    ents.forEach(function(e){if(!e.alive||p.hit[e.id])return;if(!isFoe(e)||(e.hidden&&e.type!=='boss'))return;
      var cx=clamp(p.x,e.x,e.x+e.w),cy=clamp(p.y,e.y,e.y+e.h);
      if(Math.hypot(cx-p.x,cy-p.y)<p.r){p.hit[e.id]=1;
        solEffect(e,p.k);}});
    hooks.forEach(function(h){if(Math.hypot(h.x-p.x,h.y-p.y)<p.r)h.back=true;});
    projs.forEach(function(q){if(!q.ref&&Math.hypot(q.x-p.x,q.y-p.y)<p.r)q.dead=true;});
    if(p.t>.5)pulses.splice(i,1);
  }
}
function updateCaps(dt){
  for(var i=caps.length-1;i>=0;i--){var c=caps[i];c.t+=dt;
    if(!c.rest){c.vy=Math.min(c.vy+900*dt,420);var ny=c.y+c.vy*dt;var t=LV.tile(Math.floor(c.x/TS),Math.floor((ny+10)/TS));
      if(c.vy>0&&(isSolidCode(t)||t===2)){c.y=Math.floor((ny+10)/TS)*TS-10;c.rest=true;c.ry=c.y;}else c.y=ny;
      if(c.y>LV.h*TS){caps.splice(i,1);continue;}}
    else c.y=c.ry+Math.sin(c.t*4)*2-2;
    if(c.t>.08&&!P.dead&&Math.abs(P.x+P.w/2-c.x)<22&&c.y>P.y-14&&c.y<P.y+P.h+12){takeSol(c.k);caps.splice(i,1);}
  }
}
function updateItems(dt){
  ents.forEach(function(e){
    if(!e.alive)return;
    switch(e.type){
      case 'frag':if(Math.abs(P.x+P.w/2-e.x)<18&&Math.abs(P.y+P.h/2-e.y)<24&&!P.dead){e.alive=false;RUN.frags[e.id]=1;sfx('frag');score(5);
        SAVE.fragTotal=(SAVE.fragTotal||0)+1;fx.push({type:'ring',x:e.x,y:e.y,r:3,t:.3,col:C.lime});
        if(SAVE.fragTotal%100===0){RUN.lives=Math.min(9,RUN.lives+1);SAVE.lives=RUN.lives;sfx('life');toast('100 кибермонет — дополнительная жизнь!','#affb33');}}break;
      case 'coffee':if(overlap(P,{x:e.x+8,y:e.y+8,w:16,h:24})&&!P.dead){e.alive=false;P.hp=Math.min(maxHP(),P.hp+1);sfx('power');addFx(e.x+16,e.y,'+1 периметр',C.lime);}break;
      case 'disk':if(overlap(P,{x:e.x+4,y:e.y+4,w:24,h:28})&&!P.dead){e.alive=false;RUN.disk=true;sfx('life');haptic('ok');
        SAVE.disks[RUN.id]=1;persist();showDisk(DISK_TXT[RUN.id]||'');}break;
      case 'cp':if(!e.on&&overlap(P,{x:e.x,y:e.y-30,w:TS,h:TS+30})){e.on=true;RUN.cp=Math.max(RUN.cp,e.idx);RUN.cpFrags={};for(var k in RUN.frags)RUN.cpFrags[k]=1;RUN.cpDisk=RUN.disk;
        P.hp=Math.max(P.hp,Math.min(maxHP(),P.hp+1));sfx('cp');haptic('ok');toast('Резервная копия создана','#affb33');saveResume();}break;
      case 'audit':if(!e.on&&overlap(P,{x:e.x,y:e.y-20,w:TS,h:TS+20}))auditActivate(e);break;
      case 'exit':if(overlap(P,{x:e.x+4,y:e.y-40,w:TS-8,h:TS+40})&&!P.dead)levelClear();break;
      case 'vault':if(overlap(P,{x:e.x-30,y:e.y-40,w:60,h:80})&&!P.dead){e.alive=false;levelClear();}break;
      case 'piece':if(overlap(P,{x:e.x-16,y:e.y-20,w:32,h:40})&&!P.dead){e.alive=false;levelClear();}break;
    }
  });
}
// ---------- boss ----------
var projs=[];
function bossHit(b,k){
  if(b.dead||b.state==='intro'||b.hurtT>0)return;
  if(k!==b.vuln&&!(b.kind==='g'&&b.vl&&b.vl.length>1&&k===b.k2)){if(gt-(b.missT||0)>1){b.missT=gt;sfx('block');addFx(b.x+b.w/2,b.y-10,'Не действует! Нужен '+SOL[b.vuln].abbr,C.gold);}return;}
  b.hp--;b.hurtT=.8;sfx('kill');shake=5;haptic('hit');addFx(b.x+b.w/2,b.y-10,'−1',solColor(k));
  var ct=SOL[k].counter;RUN.neut[ct]=(RUN.neut[ct]||0)+1;
  if(b.hp<=0){b.dead=true;b.state='die';b.timer=2.2;sfx('boss');hooks.length=0;projs.length=0;
    ents.forEach(function(e){if(e.type!=='boss'&&isFoe(e)&&e.alive)neutralize(e);});return;}
  var ph=b.kind==='g'?gPhase(b):b.hp>6?1:b.hp>3?2:3;
  if(ph!==b.phase){b.phase=ph;b.state='roar';b.timer=1.2;sfx('boss');
    if(b.kind==='g'){gBossPhase(b,ph);b.phase=ph;}
    else if(b.kind==='colossus')colossusPhase(b,ph);
    else if(ph===2){b.vuln='siem';toast('Фаза 2: Король зовёт Таранов. Нужен SIEM','#ff7a8a');spawnMinion(2*TS,'ram');spawnMinion(22*TS,'ram');}
    else if(ph===3){b.vuln='idm';b.altT=5;toast('Фаза 3: защита меняется — следите за цветом','#ffd43b');spawnMinion(12*TS,'phisher');}
    refillBossBlocks(true);
  }
}
function spawnMinion(x,type){
  var e={type:type,id:1000+ents.length,d:{},x:x,y:4*TS,w:type==='ram'?30:20,h:type==='ram'?24:28,dir:1,alive:true,t:0,vx:0,vy:0,stun:0,cd:1.5,
    th:type==='ram'?'brute':'cred',state:type==='ram'?'idle':'walk',l:TS,r:25*TS,home:x};
  ents.push(e);for(var i=0;i<8;i++)fx.push({type:'spark',x:x+12,y:4*TS,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,t:.5,col:C.red});
}
function bossBlockKind(side){var b=bossEnt();if(!b)return 'idm';if(b.kind==='g')return side<0?b.vuln:b.k2;if(b.phase===3)return side<0?b.k1:b.k2;return b.vuln;}
function bossEnt(){for(var i=0;i<ents.length;i++)if(ents[i].type==='boss')return ents[i];return null;}
var blockRefill={};
function refillBossBlocks(now){
  ['4,4','21,4'].forEach(function(key,i){var p=key.split(',');var x=+p[0],y=+p[1];
    var k=bossBlockKind(i?1:-1);LV.blocks[key]=k;
    if(now&&LV.tile(x,y)===4){LV.setT(x,y,3);}
  });
}
function updateBossBlocks(dt){
  ['4,4','21,4'].forEach(function(key,i){var p=key.split(',');var x=+p[0],y=+p[1];
    LV.blocks[key]=bossBlockKind(i?1:-1);
    if(LV.tile(x,y)===4){blockRefill[key]=(blockRefill[key]||0)+dt;
      if(blockRefill[key]>4.5&&!caps.some(function(c){return c.bx===x;})){LV.setT(x,y,3);blockRefill[key]=0;fx.push({type:'ring',x:x*TS+16,y:y*TS+16,r:4,t:.5,col:C.lime});}}
  });
}
function updateBoss(b,dt){
  if(b.kind==='colossus'){updateColossus(b,dt);return;}
  if(b.kind==='g'){updateGBoss(b,dt);return;}
  b.t+=dt;if(b.hurtT>0)b.hurtT-=dt;
  if(b.state==='die'){b.timer-=dt;if(Math.random()<.5)fx.push({type:'spark',x:b.x+Math.random()*b.w,y:b.y+Math.random()*b.h,vx:(Math.random()-.5)*200,vy:-Math.random()*200,t:.7,col:[C.gold,C.cred,'#fff'][Math.random()*3|0]});
    if(b.timer<=0){b.alive=false;ents.push({type:'piece',n:1,id:9999,d:{},x:b.x+b.w/2,y:8*TS,w:0,h:0,alive:true});addFx(b.x+b.w/2,b.y,'Король фишинга повержен!',C.gold);sfx('clear');}
    return;}
  var px=P.x+P.w/2,bx=b.x+b.w/2;
  if(b.phase===3){b.altT-=dt;if(b.altT<=0){b.altT=5;b.vuln=b.vuln==='idm'?'siem':'idm';sfx('block');addFx(bx,b.y-20,'Защита: '+(b.vuln==='idm'?'уязвим для IDM':'уязвим для SIEM'),b.vuln==='idm'?C.cred:'#ff7a8a');}}
  var fast=b.phase===3?1.35:b.phase===2?1.15:1;
  if(b.state==='intro'){b.timer-=dt;if(b.timer<=0){b.state='walk';b.timer=1.5;}}
  else if(b.state==='roar'){b.timer-=dt;if(b.timer<=0){b.state='walk';b.timer=1;}}
  else if(b.state==='walk'){
    b.dir=px>bx?1:-1;b.vx=b.dir*55*fast;if(Math.abs(px-bx)<70)b.vx=0;b.timer-=dt;
    if(b.timer<=0){b.atk++;b.state=(b.atk%3===0)?'hook':'throw';b.timer=b.state==='hook'?.7:.6;b.thrown=0;b.vx=0;}
  }else if(b.state==='throw'){
    b.vx=0;b.timer-=dt;
    if(b.timer<=0&&b.thrown<(b.phase===1?3:4)){
      var tt=.95,sx=bx+b.dir*24,sy=b.y+20,tx=px+(Math.random()-.5)*90+b.thrown*12*b.dir,ty=P.y+P.h;
      var g=900,vx=(tx-sx)/tt,vy=(ty-sy-.5*g*tt*tt)/tt;
      projs.push({x:sx,y:sy,vx:vx,vy:vy,g:g,t:0,rot:0});b.thrown++;b.timer=.28/fast;sfx('bolt');
      if(b.thrown>=(b.phase===1?3:4)){b.state='walk';b.timer=(1.9+Math.random())/fast;}
    }
  }else if(b.state==='hook'){
    b.vx=0;b.timer-=dt;
    if(b.timer<=0){var sx2=bx+b.dir*40,sy2=b.y+20,ttx=P.x+P.w/2,tty=P.y+P.h/2,d=Math.hypot(ttx-sx2,tty-sy2)||1;

function markSVG(n){return '<svg viewBox="0 0 153 153" width="'+n+'" height="'+n+'" aria-hidden="true">'+MARK_D.map(function(m){return '<path d="'+m[1]+'" fill="'+m[0]+'"/>';}).join('')+'</svg>';}
function showOverlay(html,opt){opt=opt||{};atMain=false;var o=$('ov'),c=$('ovc');c.className='ovc'+(opt.wide?' wide':'');c.innerHTML=html;o.hidden=false;o.classList.toggle('clear',!!opt.clear);o.scrollTop=0;
  var f=c.querySelector('[data-focus]')||c.querySelector('button');if(f&&!MOBILE)try{f.focus({preventScroll:true});}catch(e){}syncBack();}
function hideOverlay(){$('ov').hidden=true;syncBack();}
function on(id,fn){var e=$(id);if(e)e.addEventListener('click',function(ev){audioUnlock();haptic('sel');fn(ev);});}
var screen='';

// ---------- main menu ----------
function hasProgress(){return SAVE&&(Object.keys(SAVE.levels||{}).length>0||SAVE.resume);}
function showMenu(){
  state='menu';screen='menu';$('pausebtn').hidden=true;playSong('menu');
  T(function(t){if(t.disableClosingConfirmation)t.disableClosingConfirmation();});
  var cont=hasProgress();
  showOverlay(LOGO_SVG+'<h1>Puzzle <em>Quest</em></h1><p>Хакеры «Чёрного ключа» разбили логотип Puzzle и заперли директора. Агент Пазл идёт его спасать.</p>'+
    '<div class="acts">'+(cont?'<button class="btn" id="m-cont" data-focus>Продолжить</button>':'')+
    '<button class="btn'+(cont?' ghost':'')+'" id="m-new"'+(cont?'':' data-focus')+'>Новая игра</button>'+
    '<div class="acts row"><button class="btn ghost" id="m-intro">Предыстория</button><button class="btn ghost" id="m-help">Справочник</button></div>'+
    '<button class="btn ghost" id="m-snd">Звук: '+(SETTINGS.mute?'выкл':'вкл')+'</button></div>'+
    '<a class="home" href="index.html">← Все игры Puzzle Systems</a>',{clear:true});atMain=true;syncBack();var hm=document.querySelector('#ovc a.home');if(hm)hm.addEventListener('click',function(e){e.preventDefault();goHome();});
  on('m-cont',function(){if(SAVE.resume)askResume();else showMap();});
  on('m-new',function(){if(cont)confirmNew();else chooseDiff();});
  on('m-intro',function(){startIntro(function(){showMenu();});});
  on('m-help',function(){showHelp('th',showMenu);});
  on('m-snd',function(){SETTINGS.mute=!SETTINGS.mute;audioUnlock();persist();showMenu();});
}
function confirmNew(){
  showOverlay('<span class="lbl">Новая игра</span><h2>Начать сначала?</h2><p>Пройденные уровни, звёзды и кибермонеты будут сброшены.</p><div class="acts"><button class="btn" id="c-yes">Да, начать заново</button><button class="btn ghost" id="c-no" data-focus>Отмена</button></div>');
  on('c-yes',chooseDiff);on('c-no',showMenu);
}
function chooseDiff(){
  showOverlay('<span class="lbl">Новая игра</span><h2>Выберите сложность</h2><div class="diff">'+
    '<button id="d-easy"><b>Стажёр</b><span>5 делений периметра. Для знакомства с игрой.</span></button>'+
    '<button id="d-hard" data-focus><b>Эксперт</b><span>3 деления периметра. Классическая сложность.</span></button></div>'+
    '<button class="btn ghost" id="d-back">Назад</button>');
  function go(d){var intro=SAVE.intro;SAVE=blankSave();SAVE.intro=intro;SAVE.diff=d;SAVE.settings=SETTINGS;persist();
    if(!SAVE.intro)startIntro(function(){startLevel('1-1');});else startLevel('1-1');}
  on('d-easy',function(){go('easy');});on('d-hard',function(){go('hard');});on('d-back',showMenu);
}
function askResume(){
  var r=SAVE.resume;
  showOverlay('<span class="lbl">Продолжить</span><h2>Уровень '+r.lvl+' · '+esc(getDef(r.lvl).name)+'</h2><p>'+(r.cp>=0?'Вы остановились посреди уровня. Продолжить с последней резервной копии?':'Вы остановились посреди уровня. Начать его заново?')+'</p>'+
    '<div class="acts"><button class="btn" id="r-yes" data-focus>'+(r.cp>=0?'С резервной копии':'Начать уровень')+'</button><button class="btn ghost" id="r-map">Карта</button></div>');
  on('r-yes',function(){startLevel(r.lvl,true);});on('r-map',showMap);
}

// ---------- map ----------
function worldDef(n){return WORLDS[n-1];}
function worldDone(n){var w=worldDef(n);return !!(w&&w.lv&&SAVE.levels[w.lv[w.lv.length-1]]&&SAVE.levels[w.lv[w.lv.length-1]].done);}
function levelOpen(id){var n=worldOf(id),w=worldDef(n),i=w.lv.indexOf(id);if(i<0)return false;if(i===0)return n===1||worldDone(n-1);var p=SAVE.levels[w.lv[i-1]];return !!(p&&p.done);}
function piecesHTML(got){var h='<div class="pieces" aria-label="Части логотипа">';for(var i=0;i<6;i++)h+='<span class="'+(i<got?'on':'')+'">'+(i<got?markSVG(18):(i+1))+'</span>';return h+'</div>';}
function showMap(){
  state='menu';screen='map';$('pausebtn').hidden=true;
  var h='<span class="lbl">Карта сети</span><h2>Верните 6 частей пазла</h2>'+piecesHTML(SAVE.pieces||0)+'<div class="map">';
  var next=null;
  WORLDS.forEach(function(w){
    if(!w.lv){h+='<div class="world off"><div class="wh"><b>Мир '+w.n+' · '+w.name+'</b><span>скоро</span></div><p class="small" style="margin:0;color:var(--muted)">'+w.sub+'</p></div>';return;}
    var open0=levelOpen(w.lv[0]);
    h+='<div class="world'+(open0?'':' off')+'"><div class="wh"><b>Мир '+w.n+' · '+w.name+'</b><span>'+w.sub+'</span></div><div class="lvls">';
    w.lv.forEach(function(id,i){var s2=SAVE.levels[id],open=levelOpen(id),st='';if(open&&!(s2&&s2.done)&&!next)next=id;
      for(var k=0;k<3;k++)st+=s2&&s2.stars>k?'★':'<u>★</u>';
      h+='<button class="lvl'+(s2&&s2.done?' done':'')+(next===id?' next':'')+'" data-l="'+id+'"'+(open?'':' disabled')+(next===id?' data-focus':'')+'><b>'+id+'</b><small>'+w.names[i]+'</small><i>'+st+'</i></button>';});
    h+='</div></div>';
  });
  h+='</div><p class="small">Кибермонет собрано: <b>'+(SAVE.fragTotal||0)+'</b> · жизни: <b>'+(SAVE.lives||3)+'</b> · сложность: <b>'+(SAVE.diff==='easy'?'Стажёр':'Эксперт')+'</b></p>';
  h+='<div class="acts row">';WORLDS.forEach(function(w){if(w.lv&&worldDone(w.n))h+='<button class="btn ghost" data-rep="'+w.n+'">Отчёт: «'+w.name+'»</button>';});h+='</div>';
  h+='<button class="btn ghost" id="mp-back">Главное меню</button>';
  showOverlay(h,{wide:true});
  Array.prototype.forEach.call(document.querySelectorAll('.lvl[data-l]'),function(b){b.addEventListener('click',function(){audioUnlock();haptic('sel');startLevel(b.getAttribute('data-l'));});});
  Array.prototype.forEach.call(document.querySelectorAll('[data-rep]'),function(b){b.addEventListener('click',function(){audioUnlock();showWorldReport(+b.getAttribute('data-rep'),showMap);});});
  on('mp-back',showMenu);
}

// ---------- reference ----------
function openWorlds(){var n=1;WORLDS.forEach(function(w){if(w.lv&&levelOpen(w.lv[0]))n=Math.max(n,w.n);});return n;}
function openList(key){var a=[];WORLDS.forEach(function(w){if(w.lv&&w.n<=openWorlds())a=a.concat(w[key]);});return a;}
var TH_GAME={cred:'Фишер: забрасывает крючок и крадёт активное решение. Обезвреживается IDM.',brute:'Таран: видит героя — разгоняется и таранит. Обезвреживается SIEM.',
  vuln:'Трещины в полу: обваливаются под ногами. Закрываются точкой аудита ИБ на уровне.'};
var TH_WORLD={sql:2,ddos:2,scan:3,lateral:3,ransom:4,priv:4,container:5,leak:5};
var SOL_WORLD={waf:2,web:2,ngfw:3,nad:3,edr:4,pam:4,cs:5,dlp:5};
function showHelp(tab,back){
  var h='<span class="lbl">Справочник</span><div class="tabs"><button id="t-th" aria-pressed="'+(tab==='th')+'">Угрозы</button><button id="t-sol" aria-pressed="'+(tab==='sol')+'">Решения</button><button id="t-keys" aria-pressed="'+(tab==='keys')+'">Управление</button></div>';
  if(tab==='th'){var OT=openList('th');h+='<div class="cards">';OT.forEach(function(k){var t=TH[k];h+='<div class="card" style="--pc:'+t.col+'"><div class="nm">'+esc(t.name)+'</div><div class="ds">'+esc(t.desc)+'</div><div class="gm">'+esc(TH_GAME[k])+'</div></div>';});
    Object.keys(TH_WORLD).forEach(function(k){var t=TH[k];if(!t||OT.indexOf(k)>=0)return;h+='<div class="card off" style="--pc:'+t.col+'"><div class="nm">'+esc(t.name)+'</div><div class="ds">Встретится в мире '+TH_WORLD[k]+'.</div></div>';});h+='</div>';}
  else if(tab==='sol'){var OS=openList('sol');h+='<div class="cards">';OS.forEach(function(k){var s=SOL[k];h+='<div class="card" style="--pc:'+solColor(k)+'"><div class="nm">'+esc(s.name)+'</div><div class="ds">'+esc(s.desc)+'</div><div class="gm">'+esc(SOL_GAME[k])+'</div></div>';});
    Object.keys(SOL_WORLD).forEach(function(k){var s=SOL[k];if(!s||OS.indexOf(k)>=0)return;h+='<div class="card off" style="--pc:#2176ff"><div class="nm">'+esc(s.name)+'</div><div class="ds">Откроется в мире '+SOL_WORLD[k]+'.</div></div>';});
    h+='<div class="card" style="--pc:#affb33"><div class="nm">Аудит информационной безопасности</div><div class="ds">Точка аудита на уровне закрывает все неисправленные уязвимости на участке — как настоящий аудит, который находит слабые места до того, как ими воспользуются злоумышленники.</div></div></div>';}
  else{h+=MOBILE?'<div class="keys"><kbd>Джойстик</kbd><span>коснитесь в любом месте левой половины экрана и ведите пальцем: влево и вправо — бег, вниз — присесть</span><kbd>A</kbd><span>прыжок (дольше держите — выше)</span><kbd>B</kbd><span>применить решение</span><kbd>⇄</kbd><span>переключить решение</span><kbd>Вниз + A</kbd><span>спрыгнуть со стола</span><kbd>Пауза</kbd><span>кнопка справа вверху или «Назад» Telegram</span></div>':
    '<div class="keys"><kbd>← →</kbd><span>бег (или A / D)</span><kbd>Пробел</kbd><span>прыжок (или Z / K), дольше держите — выше</span><kbd>X</kbd><span>применить решение (или J / Shift)</span><kbd>Q</kbd><span>переключить решение (или C)</span><kbd>↓ + Пробел</kbd><span>спрыгнуть со стола</span><kbd>P / Esc</kbd><span>пауза</span><kbd>Геймпад</kbd><span>стик или крестовина, A — прыжок, X/B — решение, Y — переключить</span></div>';
    h+='<p class="small">Прыжок сверху оглушает угрозу, а навсегда её обезвреживает только подходящее решение.</p>';}
  h+='<button class="btn ghost" id="t-back" data-focus>Назад</button>';

// ---------- pause ----------
function pauseGame(){
  if(state!=='play')return;state='pause';for(var k in KEYS)KEYS[k]=0;touches={};touchUpdate();
  showOverlay('<span class="lbl">Пауза</span><h2>'+RUN.id+' · '+esc(LV.name)+'</h2><p>Жизни: <b>'+RUN.lives+'</b> · кибермонеты: <b>'+Object.keys(RUN.frags).length+'/'+RUN.fragTotal+'</b></p>'+
    '<div class="acts"><button class="btn" id="p-res" data-focus>Продолжить</button><button class="btn ghost" id="p-rst">Начать уровень заново</button>'+
    '<div class="acts row"><button class="btn ghost" id="p-map">Карта</button><button class="btn ghost" id="p-menu">Главное меню</button></div>'+
    '<div class="acts row"><button class="btn ghost" id="p-help">Справочник</button><button class="btn ghost" id="p-snd">Звук: '+(SETTINGS.mute?'выкл':'вкл')+'</button></div></div>'+(MOBILE?'':'<p class="small">P или Esc — продолжить.</p>'));
  on('p-res',resumeGame);on('p-rst',function(){SAVE.resume=null;startLevel(RUN.id);});
  on('p-map',function(){saveResume();showMap();});on('p-menu',function(){saveResume();showMenu();});
  on('p-help',function(){showHelp('th',function(){state='play';pauseGame();});state='pause';});
  on('p-snd',function(){SETTINGS.mute=!SETTINGS.mute;audioUnlock();persist();state='play';pauseGame();});
}
function resumeGame(){if(state!=='pause')return;if(portrait())return;state='play';hideOverlay();lastT=performance.now();}
function onPortrait(){if(state==='play')pauseGame();}

var TAIL='<span class="pz">Компания Puzzle Systems подберёт нужный Вам продукт в соответствии с рекомендацией. Напишите нам: <a class="site" href="'+SITE+'" target="_blank" rel="noopener">puzzle.systems</a></span>';
function recsHTML(dmg){
  var ks=Object.keys(dmg).filter(function(k){return dmg[k]>0&&TH[k];}).sort(function(a,b){return dmg[b]-dmg[a];});
  var h='<span class="lbl">'+(ks.length?'Рекомендации по пропущенным атакам':'Рекомендации')+'</span><div class="recs">';
  ks.forEach(function(k){var t=TH[k],n=dmg[k],txt;
    txt=n>=3?'Вы пропустили большое количество атак «'+t.name+'»':'Вы пропустили '+n+' '+plural(n,'атаку','атаки','атак')+' «'+t.name+'»';
    h+='<div class="rec" style="--pc:'+t.col+'"><b>'+esc(txt)+'</b>, вам необходимо '+esc(t.need)+', '+esc(t.help)+'.'+TAIL+'</div>';});
  if(!ks.length)h+='<div class="rec" style="--pc:#affb33"><b>Ни одна атака не прошла.</b> Чтобы так же надёжно была защищена реальная инфраструктура, нужен комплекс решений.'+TAIL+'</div>';
  return h+'</div>';
}
function fmtTime(s){s=Math.round(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function sumObj(o){var n=0;for(var k in o)n+=o[k];return n;}
function levelClear(){
  if(state!=='play')return;state='clear';sfx('clear');haptic('ok');
  var id=RUN.id,got=Object.keys(RUN.frags).length,boss=LV.boss;
  var stars=1,dm=sumObj(RUN.dmg);
  if(boss){if(RUN.bossNoDeath)stars++;if(dm<=2)stars++;}else{if(got>=Math.ceil(RUN.fragTotal*.8))stars++;if(RUN.disk)stars++;}
  var prev=SAVE.levels[id]||{};
  SAVE.levels[id]={done:true,stars:Math.max(prev.stars||0,stars),frags:Math.max(prev.frags||0,got),dmg:RUN.dmg,neut:RUN.neut,time:RUN.time};
  SAVE.resume=null;SAVE.lives=RUN.lives;var wn=worldOf(id);if(boss)SAVE.pieces=Math.max(SAVE.pieces||0,wn);persist();
  $('pausebtn').hidden=true;T(function(t){if(t.disableClosingConfirmation)t.disableClosingConfirmation();});
  if(boss&&wn===7){setTimeout(function(){runScenes([{d:6.5,cap:'Хранилище открыто! Директор свободен, а логотип Puzzle снова собран из шести частей.',draw:sceneVaultOpen},{d:7,cap:'«Агент Пазл, ты спас компанию!»',draw:sceneJoke}],function(){showFinalReport();},'menu');},900);return;}
  if(boss){setTimeout(function(){startOutro(wn,function(){showWorldReport(wn,showMap,true);});},900);return;}
  var idx=worldDef(wn).lv.indexOf(id),nextId=worldDef(wn).lv[idx+1];
  var h='<span class="lbl">Уровень '+id+' пройден</span><h2>'+esc(LV.name)+'</h2><div class="stars" aria-label="'+stars+' из 3 звёзд">';for(var i=0;i<3;i++)h+=i<stars?'★':'<i>★</i>';h+='</div>';
  h+='<dl class="rep"><dt>Кибермонеты</dt><dd>'+got+' / '+RUN.fragTotal+'</dd><dt>Секретный диск</dt><dd>'+(RUN.disk?'найден':'не найден')+'</dd><dt>Угроз обезврежено</dt><dd>'+(sumObj(RUN.neut)-(RUN.neut.vuln||0))+'</dd><dt>Уязвимостей закрыто аудитом</dt><dd>'+(RUN.neut.vuln||0)+'</dd><dt>Пропущено атак</dt><dd>'+dm+'</dd><dt>Время</dt><dd>'+fmtTime(RUN.time)+'</dd></dl>';
  h+='<p class="small">Звёзды: пройти уровень · собрать 80% кибермонет · найти секретный диск.</p>';
  if(dm)h+=recsHTML(RUN.dmg);
  h+='<div class="acts"><button class="btn" id="c-next" data-focus>'+(nextId?'Дальше: '+nextId:'Карта')+'</button><div class="acts row"><button class="btn ghost" id="c-again">Переиграть</button><button class="btn ghost" id="c-map">Карта</button></div></div>';
  setTimeout(function(){showOverlay(h);on('c-next',function(){if(nextId)startLevel(nextId);else showMap();});on('c-again',function(){startLevel(id);});on('c-map',showMap);},700);
}
function gameOver(){
  state='over';sfx('over');$('pausebtn').hidden=true;T(function(t){if(t.disableClosingConfirmation)t.disableClosingConfirmation();});
  var h='<span class="lbl">Отчёт</span><h2>Резервные копии закончились</h2><p>Агент Пазл потерял все жизни на уровне '+RUN.id+'. Уровень придётся пройти заново, пройденные уровни сохранены.</p>';
  h+=recsHTML(RUN.dmg);

  showOverlay(h);on('g-again',function(){startLevel(RUN.id);});on('g-map',showMap);
}
var PIECE_TXT=['Первая','Вторая','Третья','Четвёртая','Пятая','Шестая'];
function showWorldReport(n,back,fresh){
  state='menu';screen='report';var w=worldDef(n);
  var dmg={},neut=0,time=0,stars=0,frags=0;
  w.lv.forEach(function(id){var s=SAVE.levels[id];if(!s)return;for(var k in s.dmg)dmg[k]=(dmg[k]||0)+s.dmg[k];for(var q in s.neut)if(q!=='vuln')neut+=s.neut[q];time+=s.time||0;stars+=s.stars||0;frags+=s.frags||0;});
  var h='<span class="lbl">Отчёт по миру «'+w.name+'»</span><h2>'+(fresh?PIECE_TXT[n-1]+' часть пазла возвращена!':'Мир «'+w.name+'» пройден')+'</h2>'+piecesHTML(Math.max(n,SAVE.pieces||0));
  h+='<dl class="rep"><dt>Звёзды</dt><dd>'+stars+' / 12</dd><dt>Кибермонеты</dt><dd>'+frags+'</dd><dt>Угроз обезврежено</dt><dd>'+neut+'</dd><dt>Пропущено атак</dt><dd>'+sumObj(dmg)+'</dd><dt>Время</dt><dd>'+fmtTime(time)+'</dd></dl>';
  h+=recsHTML(dmg);
  var nx=worldDef(n+1);
  if(nx&&nx.lv)h+='<p class="small">Дальше — мир '+nx.n+' «'+nx.name+'»: '+nx.sub+'.</p>';
  else if(nx)h+='<p class="small">Мир '+nx.n+' «'+nx.name+'» уже в разработке: '+nx.sub+'.</p>';
  h+='<div class="acts">'+(nx&&nx.lv&&fresh?'<button class="btn" id="w-next" data-focus>'+(nx.n===7?'Дальше: финал':'Дальше: мир '+nx.n)+'</button>':'')+'<button class="btn'+(nx&&nx.lv&&fresh?' ghost':'')+'" id="w-map"'+(nx&&nx.lv&&fresh?'':' data-focus')+'>Карта</button><button class="btn ghost" id="w-menu">Главное меню</button></div>';
  showOverlay(h,{wide:false});on('w-map',back||showMap);on('w-menu',showMenu);on('w-next',function(){startLevel(nx.lv[0]);});
}

function showFinalReport(){
  state='menu';screen='report';var dmg={},neut=0,time=0,stars=0,frags=0,n=0;
  WORLDS.forEach(function(w){(w.lv||[]).forEach(function(id){var s=SAVE.levels[id];if(!s)return;n++;for(var k in s.dmg)dmg[k]=(dmg[k]||0)+s.dmg[k];for(var q in s.neut)if(q!=='vuln')neut+=s.neut[q];time+=s.time||0;stars+=s.stars||0;frags+=s.frags||0;});});
  var h='<span class="lbl">Игра пройдена</span><h2>Директор спасён!</h2><p><b>«А я думал, что это шутка»</b>, — сказал директор, когда Агент Пазл открыл хранилище.</p>'+piecesHTML(6);
  h+='<dl class="rep"><dt>Уровней пройдено</dt><dd>'+n+'</dd><dt>Звёзды</dt><dd>'+stars+' / '+(n*3)+'</dd><dt>Кибермонеты</dt><dd>'+frags+'</dd><dt>Угроз обезврежено</dt><dd>'+neut+'</dd><dt>Пропущено атак</dt><dd>'+sumObj(dmg)+'</dd><dt>Время</dt><dd>'+fmtTime(time)+'</dd></dl>';
  h+=recsHTML(dmg);
  h+='<p class="small">Спасибо за игру! Перепройдите уровни, чтобы собрать все звёзды и секретные диски.</p><div class="acts"><button class="btn" id="f-map" data-focus>Карта</button><button class="btn ghost" id="f-menu">Главное меню</button></div>';
  showOverlay(h);on('f-map',showMap);on('f-menu',showMenu);

var outroN=1;
function startIntro(done){runScenes(INTRO,function(){SAVE.intro=true;persist();done();},'menu');}
function startOutro(n,done){outroN=n;runScenes([{d:5,cap:PIECE_TXT[n-1]+' часть пазла возвращена!',draw:sceneOutro1},{d:6.5,cap:worldDef(n).outro,draw:sceneOutro2}],done,'menu');}
function runScenes(list,done,song){
  hideOverlay();state='intro';introSkipReq=0;scene={list:list,i:0,t:0,done:done};playSong(song||'night');$('pausebtn').hidden=true;
  var b=document.createElement('button');b.className='skip';b.id='skipbtn';b.type='button';b.textContent='Пропустить ›';
  b.addEventListener('click',function(e){e.stopPropagation();endScenes();});$('wrap').appendChild(b);syncBack();
}
function endScenes(){if(!scene)return;var d=scene.done;scene=null;var b=$('skipbtn');if(b)b.remove();state='menu';d&&d();}
function updateScenes(dt){
  if(!scene)return;scene.t+=dt;
  if(introSkipReq){introSkipReq=0;if(scene.t>.6){scene.i++;scene.t=0;}}
  if(scene.t>scene.list[scene.i].d){scene.i++;scene.t=0;}
  if(scene.i>=scene.list.length)endScenes();
}
function drawScenes(){
  var s=SCALE*DPR;ctx.setTransform(s,0,0,s,0,0);
  var sc=scene.list[scene.i],t=scene.t,a=Math.min(1,t/.5,(sc.d-t)/.5);
  ctx.save();sc.draw(t,sc.d);ctx.restore();
  // fade
  ctx.fillStyle='rgba(0,0,0,'+(1-Math.max(0,a))+')';ctx.fillRect(0,0,VW,VIEW_H);
  // caption (in CSS pixels)
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var k=clamp(SH/420,.85,1.3);ctx.font='600 '+Math.round(15*k)+'px Manrope,Arial';var lines=wrapText(sc.cap,Math.min(SW*.8,560*k)),lh=21*k;
  var ch=lines.length*lh+22,cy=SH-ch-Math.max(16,readInsetCached('--sb')+14)-(MOBILE?0:10);
  var ca=Math.min(1,Math.max(0,(t-.3)*2),(sc.d-t)*2);ctx.globalAlpha=ca;
  ctx.fillStyle='rgba(5,10,28,.78)';rr(SW/2-Math.min(SW*.84,600*k)/2,cy,Math.min(SW*.84,600*k),ch,12);ctx.fill();
  ctx.fillStyle='#eef2ff';ctx.textAlign='center';lines.forEach(function(l,i){ctx.fillText(l,SW/2,cy+11+lh*.78+i*lh);});
  ctx.globalAlpha=1;
  // progress dots
  for(var i=0;i<scene.list.length;i++){ctx.fillStyle=i===scene.i?C.lime:'rgba(255,255,255,.25)';circ(SW/2+(i-(scene.list.length-1)/2)*12,cy-12,3);ctx.fill();}
}

function logo6(cx,cy,s,t,broken,got){ // the real Puzzle Systems mark split into 6 parts (3x2)
  var cw=s/3,ch=s/2;
  for(var i=0;i<6;i++){var gx=i%3,gy=i/3|0,x=cx-s/2+gx*cw+cw/2,y=cy-s/2+gy*ch+ch/2;
    var off=broken?broken(i):{x:0,y:0,r:0,a:1};
    ctx.save();ctx.translate(x+off.x,y+off.y);ctx.rotate(off.r||0);
    var on=got==null||i<got;
    if(on){ctx.globalAlpha=off.a==null?1:off.a;drawMarkCell(i,0,0,s);}
    else{ctx.globalAlpha=.16;drawMarkCell(i,0,0,s);ctx.globalAlpha=.5;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.setLineDash([4,4]);ctx.lineWidth=1.2;ctx.strokeRect(-cw/2+1,-ch/2+1,cw-2,ch-2);ctx.setLineDash([]);}
    ctx.restore();}
  ctx.globalAlpha=1;
}

var menuT=0;

// ---------- Telegram back button ----------
function syncBack(){if(!MOBILE)return;T(function(t){if(!t.BackButton)return;var show=true;if(show)t.BackButton.show();else t.BackButton.hide();});}
if(MOBILE)T(function(t){if(t.BackButton)t.BackButton.onClick(function(){
  if(state==='play')pauseGame();else if(state==='pause')resumeGame();else if(state==='intro')endScenes();else if(screen==='map'||screen==='report')showMenu();else if(atMain)goHome();else showMenu();});});
$('pausebtn').addEventListener('click',function(){audioUnlock();if(state==='play')pauseGame();});
$('ov').addEventListener('click',function(){audioUnlock();});

// ---------- main loop ----------
var lastT=performance.now(),acc=0,STEP=1/120;
function frame(now){
  var dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  readInput();
  if(PR.p){PR.p=0;if(state==='play')pauseGame();else if(state==='pause')resumeGame();}
  musicTick();
  if(state==='play'){
    acc+=dt;var n=0;
    while(acc>=STEP&&n<8){updatePlay(STEP);if(n===0)clearPressed();acc-=STEP;n++;if(state!=='play')break;}
    if(n>=8)acc=0;
  }else{clearPressed();acc=0;}
  if(state==='intro')updateScenes(dt);
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#050a1c';ctx.fillRect(0,0,lo.width,lo.height);
  if(state==='intro'&&scene)drawScenes();
  else if(LV&&(state==='play'||state==='pause'||state==='clear'||state==='over')){drawWorld();drawHUD();}
  else drawMenuBg(dt);
  present();
  requestAnimationFrame(frame);
}
function boot(){
  initWorld2();initWorld3();
  if(MOBILE)T(function(t){t.ready();t.expand();if(t.disableVerticalSwipes)t.disableVerticalSwipes();
    if(t.setHeaderColor)t.setHeaderColor('#0a1230');if(t.setBackgroundColor)t.setBackgroundColor('#0a1230');if(t.setBottomBarColor)t.setBottomBarColor('#0a1230');
    if(t.requestFullscreen&&t.isVersionAtLeast&&t.isVersionAtLeast('8.0'))try{t.requestFullscreen();}catch(e){}
    if(t.onEvent){t.onEvent('viewportChanged',fit);t.onEvent('fullscreenChanged',fit);t.onEvent('safeAreaChanged',fit);t.onEvent('contentSafeAreaChanged',fit);}});
  fit();if(MOBILE)layoutTouch();
  window.addEventListener('resize',function(){if(MOBILE)layoutTouch();});
  loadSave(function(){
    if(!SAVE.intro)startIntro(showMenu);else showMenu();
    requestAnimationFrame(function(t){lastT=t;frame(t);});
  });
}
window.__q={get projs(){return projs;},get P(){return P;},get LV(){return LV;},get ents(){return ents;},get RUN(){return RUN;},get state(){return state;},get SAVE(){return SAVE;},
  setGod:function(v){godMode=v;},start:startLevel,KEYS:KEYS,IN:IN,PR:PR,cam:cam,showMap:showMap,showMenu:showMenu,pause:pauseGame,setSave:function(s){SAVE=s;},
  endScenes:endScenes,get scene(){return scene;},levelClear:levelClear,TS:TS};
boot();
